      const stopRec=()=>{ if(recRef){ try{recRef.stop();}catch(_){} recRef=null; } $("#vcLive",el).classList.remove("rec"); };
      $("#vcCancel",el).onclick=()=>{ stopRec(); closeSheet(); };
      $("#vcDone",el).onclick=()=>{
        stopRec();
        if(!finalTxt.trim()){ toast("Não ouvi nada ainda"); return; }
        parsed = parseVoiceText(finalTxt);
        showVoiceReview(el, parsed);
      };
    },
    ()=>{ if(recRef){ try{recRef.stop();}catch(_){} recRef=null; } });
}
function showVoiceReview(el, p){
  const ctx=[];
  if(p.date) ctx.push(fmtDateShort(p.date));
  if(p.locId) ctx.push((locById(p.locId)||{}).name);
  if(p.conv) ctx.push(p.conv);
  if(p.turno) ctx.push(p.turno);
  $("#vcResult",el).innerHTML = `
    <div class="card" style="padding:12px 14px;margin-top:12px">
      <div class="card-title" style="margin-bottom:8px">Entendi assim ↓ <span class="hint">ajuste se precisar</span></div>
      ${ctx.length?`<p class="note" style="margin-bottom:8px">📍 ${esc(ctx.join(" · "))}</p>`:""}
      ${p.items.length? p.items.map((it,i)=>`
        <div class="vc-item">
          <div class="vc-main"><div class="vc-name">${esc(dispName(it.exam))}</div>
          <div class="vc-sub">ouvi: "${esc(it.text)}"</div></div>
          <div class="stepper">
            <button data-vdec="${i}">−</button><span class="qty">${it.qty}</span><button data-vinc="${i}">+</button>
          </div>
        </div>`).join("") : '<p class="note">Nenhum exame reconhecido — tente falar "quantidade + nome do exame".</p>'}
      ${p.leftovers.length?`<p class="note" style="margin-top:8px;color:var(--warn)">Não reconheci: ${esc(p.leftovers.join("; "))}</p>`:""}
    </div>`;
  $("#vcDone",el).textContent = p.items.length? "Adicionar ao lançamento":"Tentar de novo";
  $("#vcDone",el).onclick = ()=>{
    if(!p.items.length){ closeSheet(); voiceSheet(); return; }
    if(p.date) draft.date=p.date;
    if(p.locId){ draft.locId=p.locId; draft.conv=null; }
    if(p.conv) draft.conv=p.conv;
    p.items.forEach(it=>{ draft.qty[it.exam.id]=(draft.qty[it.exam.id]||0)+it.qty; });
    closeSheet();
    const n=p.items.reduce((s,i)=>s+i.qty,0);
    toast(n+" exame"+(n===1?"":"s")+" adicionado"+(n===1?"":"s")+" — revise e salve");
    renderAdd();
  };
  $$("[data-vinc]",el).forEach(b=> b.onclick=()=>{ p.items[+b.dataset.vinc].qty++; showVoiceReview(el,p); });
  $$("[data-vdec]",el).forEach(b=> b.onclick=()=>{ const it=p.items[+b.dataset.vdec]; it.qty=Math.max(0,it.qty-1); if(it.qty===0) p.items.splice(+b.dataset.vdec,1); showVoiceReview(el,p); });
}

/* ---------- Lançamento por imagem (OCR) ---------- */
let tessPromise = null;
function ensureTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessPromise) return tessPromise;
  tessPromise = new Promise((res,rej)=>{
    const sc=document.createElement("script");
    sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    sc.onload=()=>res();
    sc.onerror=()=>{ tessPromise=null; rej(new Error("offline")); };
    document.head.appendChild(sc);
  });
  return tessPromise;
}
async function runOCR(file, onProg){
  await ensureTesseract();
  const worker = await Tesseract.createWorker("por", 1, {
    logger: m=>{ if(m.status==="recognizing text") onProg(Math.round((m.progress||0)*100)); }
  });
  const { data } = await worker.recognize(file);
  await worker.terminate();
  return data.text||"";
}
function parseImageText(text){
  const loc = locById(draft.locId);
  const locMods = (loc&&loc.mods&&loc.mods.length)? loc.mods : MODS;
  const pool = S.exams.filter(x=>locMods.includes(x.mod));
  const agg = new Map(); const leftovers=[];
  String(text).split(/\n+/).forEach(line=>{
    const raw = line.trim();
    let ln = normName(raw);
    if(ln.replace(/[^a-z]/g,"").length<3) return;
    // quantidade: número no início ("5 abdome…"), no fim ("abdome … 5") ou "x5"
    let qty=1, m;
    if((m=ln.match(/^(\d{1,3})\b/))){ qty=+m[1]; ln=ln.slice(m[0].length); }
    else if((m=ln.match(/\bx\s?(\d{1,3})$/))){ qty=+m[1]; ln=ln.slice(0,ln.length-m[0].length); }
    else if((m=ln.match(/\b(\d{1,3})$/))){ qty=+m[1]; ln=ln.slice(0,ln.length-m[0].length); }
    if(qty<1||qty>200) qty=1;
    const toks = ln.split(" ").filter(t=>t && !VOICE_FILL.has(t) && !/^\d+$/.test(t))
      .map(t=> ABBR[t]!==undefined? ABBR[t]:t).filter(Boolean);
    if(!toks.length) return;
    let best=null, bestS=0;
    pool.forEach(x=>{
      const txt=examSearchText(x);
      let hit=0; toks.forEach(t=>{ if(txt.includes(t)) hit++; });
      let sc=hit/toks.length;
      if(sc>0 && getPrice(draft.locId,x.id,draft.conv)!=null) sc+=0.12;
      if(sc>bestS){ bestS=sc; best=x; }
    });
    if(best && bestS>=0.55){
      if(!agg.has(best.id)) agg.set(best.id,{qty:0, exam:best, n:0, first:raw.slice(0,42)});
      const a=agg.get(best.id); a.qty+=qty; a.n++;
    } else leftovers.push(raw.slice(0,48));
  });
  return {
    items: Array.from(agg.values()).map(a=>({qty:a.qty, exam:a.exam, text:a.first+(a.n>1?` (+${a.n-1} linhas)`:"")})),
    leftovers: leftovers.slice(0,8)
  };
}

          prog.innerHTML="";

            return;

          prog.innerHTML='<p class="note" style="color:var(--warn);margin-bottom:10px">⚠️ Não consegui carregar o leitor de imagem. Verifique sua conexão com a internet e tente novamente.</p>';
          btn.disabled=false;
        }
      };
    });
}

/* ---------- Repetir dia anterior ---------- */
function repeatDaySheet(){
  const prev = Array.from(new Set(S.entries.map(e=>e.date))).filter(d=>d<draft.date).sort().reverse()[0];
  if(!prev){ toast("Nenhum dia anterior com produção"); return; }
  const list = S.entries.filter(e=>e.date===prev);
  const tot = list.reduce((s,e)=>s+entryValue(e),0);
  const nq = list.reduce((s,e)=>s+e.qty,0);
  const byLoc = {};
  list.forEach(e=>{ const l=locById(e.locId); const k=l?l.name:"?"; byLoc[k]=(byLoc[k]||0)+e.qty; });
  confirmSheet("Repetir "+fmtDateLong(prev)+"?",
    `Copia ${nq} exames (${fmtBRL0(tot)}) para ${fmtDateLong(draft.date).toLowerCase()}: ${Object.entries(byLoc).map(([k,v])=>v+"× "+k).join(", ")}. Você pode editar depois no Histórico.`,
    "Copiar lançamentos",
    ()=>{
      list.forEach(e=>{
        S.entries.push({id:"e"+(++S.entrySeq), date:draft.date, locId:e.locId, examId:e.examId, conv:e.conv, qty:e.qty, unit:e.unit, paid:false});
      });
      save(); toast(nq+" exames copiados para "+fmtDateShort(draft.date)); render();
    }, false);
}

function saveDraft(){
  const items = Object.entries(draft.qty).filter(([,n])=>n>0);
  if(!items.length) return;
  const missing = items.filter(([id])=>getPrice(draft.locId,id,draft.conv)==null);
  if(missing.length){
    toast("Defina o preço de "+dispName(examById(missing[0][0])));
    return;
  }
  items.forEach(([id,n])=>{
    S.entries.push({ id:"e"+(++S.entrySeq), date:draft.date, locId:draft.locId,
      examId:id, conv:draft.conv, qty:n, unit:getPrice(draft.locId,id,draft.conv), paid:false });
  });
  S.last = {locId:draft.locId, conv:draft.conv};
  save();
  const tot = items.reduce((s,[id,n])=>s+n,0);
  draft.qty={}; draft.search="";
  toast(tot+" exame"+(tot===1?"":"s")+" lançado"+(tot===1?"":"s")+"!");
  nav("dash");
}

              <div class="lr-sub">${l?`<span class="dot" style="background:${SLOTS[l.slot]};display:inline-block;width:7px;height:7px;margin-right:4px"></span>`+esc(l.name)+" · ":""}${esc(e.conv)} · ${fmtBRL(e.unit)}/un</div>
            </div>
            <div class="lr-side"><b>${fmtBRL(entryValue(e))}</b><small style="color:${e.paid?"var(--good)":"var(--warn)"};font-weight:700">${e.paid?"✓ pago":"pendente"}</small></div>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>`;
        }).join("")}
      </div>`;
    }).join("")}
    ${dates.length>histLimit?`<button class="btn" id="histMore">Mostrar dias anteriores</button>`:""}
  </div>`;
  $$("[data-edit]").forEach(b=> b.onclick=()=> editEntrySheet(b.dataset.edit));
  const m=$("#histMore"); if(m) m.onclick=()=>{ histLimit+=15; renderHist(); };
}

function editEntrySheet(id){
  const e = S.entries.find(x=>x.id===id); if(!e) return;
  const x = examById(e.examId)||{name:"?"};
  openSheet(`
    <h3>Editar lançamento</h3>
    <div class="sheet-body">
      <p class="note" style="margin-bottom:14px">${esc(dispName(x))} · ${esc((locById(e.locId)||{}).name||"")} · ${esc(e.conv)} · ${esc(fmtDateLong(e.date))}</p>
      <div class="input-row">
        <div class="field"><label>Quantidade</label><input class="input" id="eeQty" inputmode="numeric" value="${e.qty}"></div>
        <div class="field"><label>Valor unitário (R$)</label><input class="input" id="eeUnit" inputmode="decimal" value="${String(e.unit).replace(".",",")}"></div>
      </div>
      <div class="field"><label>Data</label><input type="date" class="input" id="eeDate" value="${e.date}"></div>
      <div class="field"><label>Pagamento</label><div class="conv-chips" id="eePay">
        <button class="chip ${e.paid?"on":""}" data-p="1">✓ Pago</button>
        <button class="chip ${!e.paid?"on":""}" data-p="0">Pendente</button>
      </div></div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-danger" id="eeDel" style="flex:0 0 auto;width:auto;padding:0 18px">Excluir</button>
      <button class="btn btn-primary" id="eeOk">Salvar</button>
    </div>`,
    el=>{
      $("#eeDel",el).onclick=()=>{
        closeSheet();
        confirmSheet("Excluir lançamento?", `${e.qty}× ${x.name} será removido do histórico. Essa ação não pode ser desfeita.`,"Excluir",()=>{
          S.entries = S.entries.filter(a=>a.id!==id); save(); toast("Lançamento excluído"); render();
        });
      };
      let eePaid = !!e.paid;
      $$("#eePay .chip",el).forEach(c=> c.onclick=()=>{ eePaid=c.dataset.p==="1"; $$("#eePay .chip",el).forEach(x=>x.classList.toggle("on",x===c)); });
      $("#eeOk",el).onclick=()=>{
        const q=parseInt($("#eeQty",el).value,10);
        const u=parseMoney($("#eeUnit",el).value);
        const d=$("#eeDate",el).value;
        if(!q||q<1){ toast("Quantidade inválida"); return; }
        if(u==null||u<0){ toast("Valor inválido"); return; }
        e.qty=q; e.unit=u; e.paid=eePaid; if(d) e.date=d;
        save(); closeSheet(); toast("Lançamento atualizado"); render();
      };
    });
}
</script>
<script>
"use strict";
/* ================== INTEGRAÇÃO COM AGENDA (Google/Apple) ================== */
const BYDAY = ["SU","MO","TU","WE","TH","FR","SA"];
const icsEsc = s => String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
const icsDT = (iso,hm) => iso.replace(/-/g,"") + "T" + hm.replace(":","") + "00";
const icsD  = iso => iso.replace(/-/g,"");
function occDates(o){
  const ts = occTimes(o);
  if(ts.allDay) return {allDay:true, s:icsD(o.date), e:icsD(addDays(o.date,1))};
  return {allDay:false, s:icsDT(o.date,ts.start), e:icsDT(ts.endNext?addDays(o.date,1):o.date, ts.end)};
}
function eventTitle(o){ const l=locById(o.locId); return "Plantão · "+(l?l.name:""); }
function eventDetails(o){
  return "RadFin · "+occLabel(o)+(o.note?" · "+o.note:"")+"\nLance a volumetria do dia no app RadFin.";
}
function gcalOpen(o){
  const d = occDates(o);
  let url = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(eventTitle(o))
    + "&dates=" + d.s + "/" + d.e
    + "&details=" + encodeURIComponent(eventDetails(o));
  if(o.type==="rule"){
    const r = S.agenda.rules.find(x=>x.id===o.id);
    let rr = ruleRRule(r||{dow:fromISO(o.date).getDay(), from:o.date});
    url += "&recur=" + encodeURIComponent(rr);
  }
  window.open(url, "_blank");
}
function nextDowFrom(iso, dow){
  let d = iso;
  while(fromISO(d).getDay()!==dow) d = addDays(d,1);
  return d;
}
function ruleRRule(r){
  const f = r.freq||"w";
  let rr;
  if(f==="m") rr = "RRULE:FREQ=MONTHLY;BYMONTHDAY=" + fromISO(r.from).getDate();
  else if(f==="2w") rr = "RRULE:FREQ=WEEKLY;INTERVAL=2;BYDAY=" + BYDAY[r.dow];
  else rr = "RRULE:FREQ=WEEKLY;BYDAY=" + BYDAY[r.dow];
  if(r.until) rr += ";UNTIL=" + icsDT(addDays(r.until,-1),"23:59");
  return rr;
}
function ruleFirstOcc(r, startBase){
  const f = r.freq||"w";
  if(f==="m"){
    const dom = fromISO(r.from).getDate();
    for(let i=0;i<62;i++){ const cand=addDays(startBase,i); if(fromISO(cand).getDate()===dom) return cand; }
    return null;
  }
  let first = nextDowFrom(startBase, r.dow);
  if(f==="2w"){
    const weeks = Math.round((fromISO(first)-fromISO(r.from))/(86400000*7));
    if(weeks%2!==0) first = addDays(first,7);
  }
  return first;
}
function buildICS(){
  const t = todayISO();
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//RadFin//Agenda//PT","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  const alarm = (S.cal.reminder>0) ? ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Plantão","TRIGGER:-PT"+S.cal.reminder+"M","END:VALARM"] : [];
  const push = (uid, dtLines, title, det, extra)=>{
    L.push("BEGIN:VEVENT","UID:"+uid+"@radfin","DTSTAMP:"+icsDT(t,"00:00"));
    dtLines.forEach(x=>L.push(x));
    if(extra) extra.forEach(x=>L.push(x));
    L.push("SUMMARY:"+icsEsc(title),"DESCRIPTION:"+icsEsc(det));
    alarm.forEach(x=>L.push(x));
    L.push("END:VEVENT");
  };
  // eventos avulsos futuros
  S.agenda.events.filter(e=>e.date>=t && locById(e.locId)).forEach(e=>{
    const o = {...e, type:"event"};
    const d = occDates(o);
    push("ev-"+e.id,
      d.allDay? ["DTSTART;VALUE=DATE:"+d.s,"DTEND;VALUE=DATE:"+d.e] : ["DTSTART:"+d.s,"DTEND:"+d.e],
      eventTitle(o), eventDetails(o));
  });
  // recorrências (semanal, quinzenal, mensal)
  S.agenda.rules.filter(r=> locById(r.locId) && (!r.until || r.until>t)).forEach(r=>{
    const first = ruleFirstOcc(r, r.from>t? r.from : t);
    if(!first || (r.until && first>=r.until)) return;
    const o = {...r, date:first, type:"rule"};
    const d = occDates(o);
    const rr = ruleRRule(r);
    const ex = S.agenda.skips.filter(s=>s.ruleId===r.id && s.date>=first)
      .map(s=> d.allDay? "EXDATE;VALUE=DATE:"+icsD(s.date) : "EXDATE:"+icsDT(s.date, occTimes(o).start));
    push("ru-"+r.id,
      d.allDay? ["DTSTART;VALUE=DATE:"+d.s,"DTEND;VALUE=DATE:"+d.e,rr] : ["DTSTART:"+d.s,"DTEND:"+d.e,rr],
      eventTitle(o), eventDetails(o), ex);
  });
  // resumo semanal às segundas
  if(S.cal.weekly){
    const mon = nextDowFrom(addDays(t,1), 1);
    push("weekly-summary",
      ["DTSTART:"+icsDT(mon,"07:30"),"DTEND:"+icsDT(mon,"07:45"),"RRULE:FREQ=WEEKLY;BYDAY=MO"],
      "RadFin · Resumo da semana",
      "Abra o RadFin para ver os plantões da semana, o previsto de honorários e a projeção do mês.");
  }
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function icsExport(){
  if(!hasAgendaData() && !S.cal.weekly){ toast("Cadastre compromissos na agenda primeiro"); return; }
  const blob = new Blob([buildICS()], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "radfin-agenda.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("Agenda exportada (.ics)");
}

/* ================== AGENDA (calendário mensal) ================== */
const agView = { y:null, m:null, sel: todayISO() }; // m: 0-11

function renderAgenda(){
  if(agView.y==null){ const d=new Date(); agView.y=d.getFullYear(); agView.m=d.getMonth(); }
  if(!S.locations.length){
    $("#view").innerHTML = `<div class="page">`+emptyState("map","Cadastre um local primeiro",
      "Os compromissos da agenda são vinculados aos seus locais de trabalho.","Ir para Locais","goLocs4")+`</div>`;
    $("#goLocs4").onclick=()=>nav("locs");
    return;
  }
  const stats = buildStats();
  const promo = (S.cal.prompt && hasAgendaData()) ? `
    <section class="card" style="border-color:var(--accent-brd)">
      <div class="card-title">Integrar com sua agenda <span class="hint">Google · Apple</span></div>
      <p class="note" style="margin-bottom:12px">Leve seus plantões para o Google Agenda ou o Calendário do iPhone — com lembrete antes de cada plantão. Exporte o arquivo e abra-o no seu app de agenda.</p>
      <div class="input-row">
        <button class="btn btn-sm" id="agDismiss">Agora não</button>
        <button class="btn btn-primary btn-sm" id="agExport1">Exportar agenda</button>
      </div>
    </section>`:"";
  $("#view").innerHTML = `<div class="page">
    <div class="sec-head" style="margin-top:0"><h2>Agenda</h2>
      <button id="agExport2" style="display:flex;align-items:center;gap:5px;color:var(--accent);font-weight:700;font-size:13px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M12 15V3m0 0L7 8m5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Exportar</button>
    </div>
    ${promo}
    ${weekSummaryCard(stats)}
    ${calendarCard()}
    ${dayDetailCard(stats)}
  </div>`;
  bindAgenda();
  const ex1=$("#agExport1"); if(ex1) ex1.onclick=icsExport;
  const dm=$("#agDismiss"); if(dm) dm.onclick=()=>{ S.cal.prompt=false; save(); renderAgenda(); };
  $("#agExport2").onclick=icsExport;
}

/* ---------- Resumo da semana ---------- */
function weekStart(iso){ const d=fromISO(iso); const off=(d.getDay()+6)%7; return addDays(iso,-off); } // segunda
const DOW_S = ["dom","seg","ter","qua","qui","sex","sáb"];

function weekSummaryCard(stats){
  const t = todayISO();
  const ws = weekStart(t);
  let nOcc=0, realized=0, expFuture=0;
  const rows = [];
  for(let i=0;i<7;i++){
    const day = addDays(ws,i);
    const occ = occurrences(day);
    const dayRev = S.entries.filter(e=>e.date===day).reduce((s,e)=>s+entryValue(e),0);
    nOcc += occ.length;
    realized += dayRev;
    const isFuture = day>t;
    let exp = 0;
    if(occ.length){
      const counts={}; occ.forEach(o=>counts[o.locId]=(counts[o.locId]||0)+1);
      exp = occ.reduce((s,o)=>s+expectedForOcc(o,stats,counts[o.locId]).v,0);
    }
    if(isFuture) expFuture += exp;
    if(!occ.length && dayRev===0) continue;
    const d = fromISO(day);
    rows.push(`
      <div class="wk-row">
        <div class="wk-day ${day===t?"today":""}"><span>${DOW_S[d.getDay()]}</span><b>${d.getDate()}</b></div>
        <div class="wk-main">
          ${occ.length? occ.map(o=>{
            const l=locById(o.locId);
            return `<div class="wk-loc"><span class="dot" style="background:${SLOTS[l.slot]}"></span><span>${esc(l.name)}</span><span class="mut" style="flex:0 0 auto">· ${esc(occLabel(o))}</span></div>`;
          }).join("") : `<div class="wk-free">sem compromisso · produção avulsa</div>`}
        </div>
        <div class="wk-val ${dayRev>0?"done":""}">
          ${dayRev>0? `<b>${fmtBRL0(dayRev)}</b><small>realizado</small>`
            : (isFuture&&exp>0? `<b class="mut">${fmtBRL0(exp)}</b><small>previsto</small>`
            : (occ.length?`<b class="mut">—</b><small>${day<t?"sem prod.":"hoje"}</small>`:""))}
        </div>
      </div>`);
  }
  return `
  <section class="card">
    <div class="card-title">Resumo da semana <span class="hint">${fmtDateShort(ws)} – ${fmtDateShort(addDays(ws,6))}</span></div>
    ${rows.length? rows.join("") : '<p class="note">Nenhum compromisso ou produção nesta semana ainda.</p>'}
    <div class="wk-tot">
      <div class="wt"><b>${nOcc}</b><span>compromissos</span></div>
      <div class="wt"><b style="color:var(--accent)">${compact(realized)}</b><span>realizado</span></div>
      <div class="wt"><b>${compact(expFuture)}</b><span>a realizar (prev.)</span></div>
    </div>
  </section>`;
}

/* ---------- Calendário ---------- */
const MONTHS_L = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function calendarCard(){
  const y=agView.y, m=agView.m;
  const first = new Date(y,m,1);
  const start = addDays(toISO(first), -first.getDay()); // domingo anterior
  const t = todayISO();
  const entryDates = new Set(S.entries.map(e=>e.date));
  let cells="";
  for(let i=0;i<42;i++){
    const day = addDays(start,i);
    const dd = fromISO(day);
    const out = dd.getMonth()!==m;
    const occ = occurrences(day);
    const dots = occ.slice(0,3).map(o=>`<i style="background:${SLOTS[locById(o.locId).slot]}"></i>`).join("")
      + (occ.length>3?'<span class="more">+</span>':"");
    cells += `<button class="cal-cell ${out?"out":""} ${day===t?"today":""} ${day===agView.sel?"sel":""}" data-cal="${day}">
      <span>${dd.getDate()}</span>
      <span class="cd">${dots}</span>
      ${entryDates.has(day)?'<span class="pb"></span>':""}
    </button>`;
  }
  return `
  <section class="card">
    <div class="cal-head">
      <div class="cal-title">${MONTHS_L[m]} ${y}</div>
      <div class="cal-nav">
        <button id="calPrev" aria-label="mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <button id="calToday" style="width:auto;padding:0 10px;font-size:11.5px;font-weight:700">hoje</button>
        <button id="calNext" aria-label="próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="cal-grid">
      ${["D","S","T","Q","Q","S","S"].map(x=>`<span class="cal-dow">${x}</span>`).join("")}
      ${cells}
    </div>
    <div class="legend" style="margin-top:10px">
      <span class="lg"><span class="dot" style="background:var(--accent);width:12px;height:3px;border-radius:2px"></span>dia com produção</span>
      <span class="lg"><span class="dot" style="background:var(--s1)"></span>compromisso</span>
    </div>
  </section>`;
}

/* ---------- Detalhe do dia ---------- */
function dayDetailCard(stats){
  const day = agView.sel;
  const occ = occurrences(day);
  const dayEntries = S.entries.filter(e=>e.date===day);
  const rev = dayEntries.reduce((s,e)=>s+entryValue(e),0);
  const nEx = dayEntries.reduce((s,e)=>s+e.qty,0);
  const counts={}; occ.forEach(o=>counts[o.locId]=(counts[o.locId]||0)+1);
  return `
  <section class="card">
    <div class="card-title">${esc(fmtDateLong(day))}</div>
    ${occ.length? occ.map((o,i)=>{
      const l=locById(o.locId);
      const ex=expectedForOcc(o,stats,counts[o.locId]);
      return `<button class="lrow" style="width:100%;text-align:left" data-occ="${i}">
        <span class="dot" style="background:${SLOTS[l.slot]};width:11px;height:11px"></span>
        <div class="lr-main">
          <div class="lr-title">${esc(l.name)}</div>
          <div class="lr-sub">${esc(occLabel(o))}${o.type==="rule"?" · <span style='color:var(--accent)'>semanal</span>":""}${o.note?" · "+esc(o.note):""}</div>
        </div>
        <div class="lr-side">${ex.known?`<b class="mut" style="font-weight:600;font-size:12.5px">~${fmtBRL0(ex.v)}</b><small>estimado</small>`:""}</div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>`;
    }).join("") : '<p class="note" style="margin-bottom:4px">Nenhum compromisso neste dia.</p>'}
    ${rev>0?`<div class="lrow"><div class="lr-main"><div class="lr-title" style="color:var(--accent)">Produção do dia</div><div class="lr-sub">${fmtN(nEx)} exames lançados</div></div><div class="lr-side"><b style="color:var(--accent)">${fmtBRL0(rev)}</b></div></div>`:""}
    <button class="btn btn-primary" id="agAdd" style="margin-top:12px">+ Adicionar compromisso</button>
  </section>`;
}

function bindAgenda(){
  $$("[data-cal]").forEach(b=> b.onclick=()=>{
    agView.sel=b.dataset.cal;
    const dd=fromISO(agView.sel);
    if(dd.getMonth()!==agView.m||dd.getFullYear()!==agView.y){ agView.m=dd.getMonth(); agView.y=dd.getFullYear(); }
    renderAgenda();
  });
  $("#calPrev").onclick=()=>{ agView.m--; if(agView.m<0){agView.m=11;agView.y--;} renderAgenda(); };
  $("#calNext").onclick=()=>{ agView.m++; if(agView.m>11){agView.m=0;agView.y++;} renderAgenda(); };
  $("#calToday").onclick=()=>{ const d=new Date(); agView.y=d.getFullYear(); agView.m=d.getMonth(); agView.sel=todayISO(); renderAgenda(); };
  $("#agAdd").onclick=()=> commitmentSheet(agView.sel);
  $$("[data-occ]").forEach(b=> b.onclick=()=>{
    const occ=occurrences(agView.sel)[+b.dataset.occ];
    if(occ) occDetailSheet(occ);
  });
}

/* ---------- Sheets de compromisso ---------- */
function commitmentSheet(date){
  let locId = S.last.locId && locById(S.last.locId)? S.last.locId : S.locations[0].id;
  let period = PERIODS[0], repeat = true, timeMode = false;
  const dow = fromISO(date).getDay();
  const perHint = p => PERIOD_TIMES[p]? PERIOD_TIMES[p][0]+"–"+PERIOD_TIMES[p][1] : "";
  openSheet(`
    <h3>Novo compromisso</h3>
    <div class="sheet-body">
      <p class="note" style="margin-bottom:14px">${esc(fmtDateLong(date))}</p>
      <div class="field"><label>Local</label><div class="conv-chips" id="cmLocs">${
        S.locations.map(l=>`<button class="chip ${l.id===locId?"on":""}" data-l="${l.id}"><span class="dot" style="background:${SLOTS[l.slot]}"></span>${esc(l.name)}</button>`).join("")
      }</div></div>
      <div class="field"><label>Turno</label><div class="conv-chips" id="cmPer">${
        PERIODS.map((p,i)=>`<button class="chip ${i===0?"on":""}" data-p="${esc(p)}">${esc(p)}</button>`).join("")
      }<button class="chip" id="cmTime">Horário…</button></div></div>
      <div class="field hidden" id="cmTimeBox">
        <label>Horário de início e fim</label>
        <div class="input-row">
          <input type="time" class="input" id="cmStart" value="07:00">
          <input type="time" class="input" id="cmEnd" value="13:00">
        </div>
        <p class="note" style="margin-top:7px">Se o fim for menor que o início, o plantão termina no dia seguinte (ex.: 19:00 → 07:00).</p>
      </div>
      <div class="field"><label>Observação (opcional)</label>
        <input class="input" id="cmNote" placeholder="Ex.: plantão 12h, cobrindo colega…"></div>
      <div class="field"><label>Recorrência</label><div class="conv-chips" id="cmRep">
        <button class="chip on" data-r="w">${dow===0||dow===6?"Todo":"Toda"} ${WEEKDAYS[dow]}</button>
        <button class="chip" data-r="2w">Quinzenal</button>
        <button class="chip" data-r="m">Mensal (dia ${fromISO(date).getDate()})</button>
        <button class="chip" data-r="once">Só neste dia</button>
      </div></div>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="cmCancel">Cancelar</button>
      <button class="btn btn-primary" id="cmOk">Salvar</button>
    </div>`,
    el=>{
      $$("#cmLocs .chip",el).forEach(c=> c.onclick=()=>{ locId=c.dataset.l; $$("#cmLocs .chip",el).forEach(x=>x.classList.toggle("on",x===c)); });
      const timeBtn=$("#cmTime",el), timeBox=$("#cmTimeBox",el);
      $$("#cmPer .chip",el).forEach(c=>{ if(c===timeBtn) return; c.onclick=()=>{
        period=c.dataset.p; timeMode=false; timeBox.classList.add("hidden");
        $$("#cmPer .chip",el).forEach(x=>x.classList.toggle("on",x===c));
      };});
      timeBtn.onclick=()=>{
        timeMode=true; timeBox.classList.remove("hidden");
        $$("#cmPer .chip",el).forEach(x=>x.classList.toggle("on",x===timeBtn));
      };
      let freq="w";
      $$("#cmRep .chip",el).forEach(c=> c.onclick=()=>{ freq=c.dataset.r; $$("#cmRep .chip",el).forEach(x=>x.classList.toggle("on",x===c)); });
      $("#cmCancel",el).onclick=closeSheet;
      $("#cmOk",el).onclick=()=>{
        const note=$("#cmNote",el).value.trim();
        const id="a"+(++S.agenda.seq);
        const base = {id, locId, note};
        if(timeMode){
          const st=$("#cmStart",el).value, en=$("#cmEnd",el).value;
          if(!st||!en){ toast("Informe início e fim"); return; }
          base.period="Horário"; base.start=st; base.end=en;
        } else base.period=period;
        if(freq!=="once") S.agenda.rules.push({...base, dow, from:date, freq});
        else S.agenda.events.push({...base, date});
        save(); closeSheet();
        toast(freq==="once"? "Compromisso adicionado" : "Compromisso "+FREQ_LABEL[freq]+" criado");
        renderAgenda();
      };
    });
}

function occDetailSheet(occ){
  const l = locById(occ.locId);
  const isRule = occ.type==="rule";
  openSheet(`
    <h3>${esc(l.name)}</h3>
    <div class="sheet-body">
      <p class="note" style="margin-bottom:16px">${esc(occLabel(occ))} · ${esc(fmtDateLong(occ.date))}${isRule?` · ${occ.freq==="m"? "repete mensalmente (dia "+fromISO(occ.date).getDate()+")" : occ.freq==="2w"? "repete quinzenalmente" : `repete ${[0,6].includes(fromISO(occ.date).getDay())?"todo":"toda"} ${WEEKDAYS[fromISO(occ.date).getDay()]}`}`:""}${occ.note?"<br>"+esc(occ.note):""}</p>
      <button class="btn" id="ocGcal" style="margin-bottom:10px;border-color:var(--accent-brd)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
        Adicionar ao Google Agenda</button>
      ${isRule?`
        <button class="btn" id="ocSkip" style="margin-bottom:10px">Pular só este dia</button>
        <button class="btn btn-danger" id="ocEnd">Encerrar recorrência a partir daqui</button>
      `:`
        <button class="btn btn-danger" id="ocDel">Excluir compromisso</button>
      `}
    </div>
    <div class="sheet-foot"><button class="btn" id="ocCancel">Fechar</button></div>`,
    el=>{
      $("#ocCancel",el).onclick=closeSheet;
      $("#ocGcal",el).onclick=()=> gcalOpen(occ);
      if(isRule){
        $("#ocSkip",el).onclick=()=>{
          S.agenda.skips.push({ruleId:occ.id, date:occ.date});
          save(); closeSheet(); toast("Dia pulado"); renderAgenda();
        };
        $("#ocEnd",el).onclick=()=>{
          const r=S.agenda.rules.find(x=>x.id===occ.id);
          if(r){ if(r.from>=occ.date){ S.agenda.rules=S.agenda.rules.filter(x=>x.id!==occ.id); } else { r.until=occ.date; } }
          save(); closeSheet(); toast("Recorrência encerrada"); renderAgenda();
        };
      } else {
        $("#ocDel",el).onclick=()=>{
          S.agenda.events=S.agenda.events.filter(x=>x.id!==occ.id);
          save(); closeSheet(); toast("Compromisso excluído"); renderAgenda();
        };
      }
    });
}
</script>
<script>
"use strict";
/* ================== LOCAIS & PREÇOS ================== */
let locView = { locId:null, conv:null, search:"", mode:null }; // locId=null → lista

/* ---------- PERFIL: modalidades do usuário ---------- */
const CK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
function modCards(selSet, dataAttr){
  return `<div class="modgrid">${MODS.map(m=>`
    <button class="modcard ${selSet.has(m)?"on":""}" data-${dataAttr}="${m}">
      <span class="mc-check">${CK_SVG}</span>
      <span><b>${m}</b><small>${esc(MOD_LABELS[m])}</small></span>
    </button>`).join("")}</div>`;
}
function profileSheet(onDone){
  const sel = new Set(S.userMods || []);
  openSheet(`
    <h3>Quais modalidades você realiza?</h3>
    <div class="sheet-body">
      <p class="note" style="margin-bottom:14px">O app mostrará apenas exames dessas modalidades ao cadastrar instituições, precificar e lançar volumetria. Você pode alterar depois em Ajustes.</p>
      ${modCards(sel,"pm")}
    </div>
    <div class="sheet-foot">
      <button class="btn btn-primary" id="pmOk">Salvar perfil</button>
    </div>`,
    el=>{
      $$("[data-pm]",el).forEach(c=> c.onclick=()=>{
        const m=c.dataset.pm;
        sel.has(m)? sel.delete(m) : sel.add(m);
        c.classList.toggle("on", sel.has(m));
      });
      $("#pmOk",el).onclick=()=>{
        if(!sel.size){ toast("Marque pelo menos uma modalidade"); return; }
        S.userMods = MODS.filter(m=>sel.has(m));
        save(); closeSheet(); toast("Perfil salvo");
        if(onDone) onDone(); else render();
      };
    });
}

/* ---------- WIZARD: nova instituição ---------- */
const wiz = { name:"", convs:"", mods:new Set(), checks:{}, prices:{}, search:"", gross:false, taxPct:"" };
function startWizard(){
  if(S.userMods===null){ profileSheet(()=>startWizard()); return; }
  wiz.name=""; wiz.convs=""; wiz.mods=new Set(); wiz.checks={}; wiz.prices={}; wiz.search=""; wiz.gross=false; wiz.taxPct="";
  const am = activeMods();
  if(am.length===1) wiz.mods.add(am[0]);
  locView = { locId:null, conv:null, search:"", mode:"wiz1" };
  renderLocs();
}
function wizSteps(step){
  return `<div class="wiz-steps">
    <span class="st ${step>=1?"on":""}">1</span><span>Instituição</span>
    <span class="ln ${step>=2?"on":""}"></span>
    <span class="st ${step>=2?"on":""}">2</span><span>Exames &amp; valores</span>
  </div>`;
}
function renderWiz1(){
  const am = activeMods();
  $("#view").innerHTML = `<div class="page">
    <button id="wzBack" style="display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:14px;margin-bottom:12px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m15 18-6-6 6-6"/></svg>Locais</button>
    <div class="sec-head" style="margin-top:0"><h2>Nova instituição</h2></div>
    ${wizSteps(1)}
    <div class="card">
      <div class="field"><label>Nome da instituição</label>
        <input class="input" id="wzName" placeholder="Ex.: Hospital São Lucas" value="${esc(wiz.name)}"></div>
      <div class="field"><label>Convênios atendidos (separe por vírgula)</label>
        <input class="input" id="wzConvs" placeholder="Ex.: Particular, Unimed, SUS" value="${esc(wiz.convs)}"></div>
      <div class="field mb0"><label>Os honorários desta instituição são…</label>
        <div class="conv-chips">
          <button class="chip ${!wiz.gross?"on":""}" id="wzNet">Líquidos (valor que recebo)</button>
          <button class="chip ${wiz.gross?"on":""}" id="wzGross">Brutos (com descontos)</button>
        </div>
        <div id="wzTaxBox" class="${wiz.gross?"":"hidden"}" style="margin-top:10px">
          <input class="input" id="wzTax" inputmode="decimal" placeholder="% de desconto médio — ex.: 16" value="${esc(String(wiz.taxPct||""))}">
          <p class="note" style="margin-top:6px">Instituições que descontam impostos/RPA ou não emitem nota: informe o desconto médio para o app estimar o valor líquido no dashboard.</p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Modalidades presentes nesta instituição</div>
      ${MODS.some(m=>!am.includes(m))?`<p class="note" style="margin-bottom:12px">Mostrando apenas as modalidades do seu perfil (${am.join(", ")}). Ajuste o perfil em Ajustes, se precisar.</p>`:""}
      <div class="modgrid">${am.map(m=>`
        <button class="modcard ${wiz.mods.has(m)?"on":""}" data-wm="${m}">
          <span class="mc-check">${CK_SVG}</span>
          <span><b>${m}</b><small>${esc(MOD_LABELS[m])}</small></span>
        </button>`).join("")}</div>
    </div>
    <button class="btn btn-primary" id="wzNext">Seguir → exames e valores</button>
  </div>`;
  $("#wzBack").onclick=()=>{ locView={locId:null,mode:null}; renderLocs(); };
  $("#wzName").oninput = e=> wiz.name=e.target.value;
  $("#wzConvs").oninput = e=> wiz.convs=e.target.value;
  $("#wzNet").onclick=()=>{ wiz.gross=false; $("#wzNet").classList.add("on"); $("#wzGross").classList.remove("on"); $("#wzTaxBox").classList.add("hidden"); };
  $("#wzGross").onclick=()=>{ wiz.gross=true; $("#wzGross").classList.add("on"); $("#wzNet").classList.remove("on"); $("#wzTaxBox").classList.remove("hidden"); };
  $("#wzTax").oninput = e=> wiz.taxPct=e.target.value;
  $$("[data-wm]").forEach(c=> c.onclick=()=>{
    const m=c.dataset.wm;
    wiz.mods.has(m)? wiz.mods.delete(m) : wiz.mods.add(m);
    c.classList.toggle("on", wiz.mods.has(m));
  });
  $("#wzNext").onclick=()=>{
    if(!wiz.name.trim()){ toast("Dê um nome à instituição"); return; }
    if(!wiz.mods.size){ toast("Marque ao menos uma modalidade"); return; }
    locView.mode="wiz2"; renderLocs(); window.scrollTo({top:0});
  };
}
function renderWiz2(){
  const convs = wiz.convs.split(",").map(s=>s.trim()).filter(Boolean);
  const firstConv = convs[0] || "Padrão";
  const q = wiz.search.trim().toLowerCase();
  const mods = MODS.filter(m=>wiz.mods.has(m));
  const nSel = Object.keys(wiz.checks).filter(id=>wiz.checks[id]).length;
  $("#view").innerHTML = `<div class="page">
    <button id="wzBack2" style="display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:14px;margin-bottom:12px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m15 18-6-6 6-6"/></svg>Voltar</button>
    <div class="sec-head" style="margin-top:0"><h2>${esc(wiz.name)}</h2></div>
    ${wizSteps(2)}
    <div class="card" style="padding:14px 16px">
      <p class="note">Marque os exames que você realiza nesta instituição e informe o honorário${convs.length>1?` do convênio <b style="color:var(--text)">${esc(firstConv)}</b> (os demais você ajusta depois na tabela)`:""}. Valores podem ficar em branco e ser definidos depois.</p>
    </div>
    <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input class="input" id="wzSearch" placeholder="Buscar exame…" value="${esc(wiz.search)}"></div>
    <div class="card" style="padding:6px 16px 10px">
      ${mods.map(m=>{
        const list = S.exams.filter(x=>x.mod===m && (!q || x.name.toLowerCase().includes(q) || (x.code||"").includes(q)));
        if(!list.length) return "";
        const allOn = list.every(x=>wiz.checks[x.id]);
        return `<div class="mod-head" style="display:flex;justify-content:space-between;align-items:center">
          <span>${esc(MOD_LABELS[m])}</span>
          <button data-wall="${m}" style="color:var(--accent);font-weight:700;font-size:10.5px;text-transform:none;letter-spacing:0">${allOn?"desmarcar todos":"marcar todos"}</button>
        </div>`+
        list.map(x=>`
          <div class="lrow">
            <button class="ck ${wiz.checks[x.id]?"on":""}" data-wck="${x.id}">${CK_SVG}</button>
            <div class="lr-main" data-wrow="${x.id}">
              <div class="lr-title" style="font-size:13px;white-space:normal;line-height:1.35">${esc(x.name)}</div>
              ${x.code?`<div class="lr-sub">TUSS ${esc(x.code)}</div>`:""}
            </div>
            ${wiz.checks[x.id]?`<input class="price-input ${wiz.prices[x.id]?"":"noval"}" inputmode="decimal" placeholder="R$ —" data-wpx="${x.id}" value="${esc(wiz.prices[x.id]||"")}">`:""}
          </div>`).join("");
      }).join("") || '<p class="note" style="padding:16px 0">Nenhum exame encontrado.</p>'}
    </div>
    <button class="total-bar" id="wzDone" style="border:none;width:100%">
      <span class="tb-l">Concluir cadastro<small>${nSel} exame${nSel===1?"":"s"} incluído${nSel===1?"":"s"}</small></span>
      <span class="tb-r">✓</span>
    </button>
  </div>`;
  $("#wzBack2").onclick=()=>{ locView.mode="wiz1"; renderLocs(); };
  const sb=$("#wzSearch");
  sb.oninput=()=>{ wiz.search=sb.value; renderWiz2(); const s2=$("#wzSearch"); s2.focus(); s2.setSelectionRange(s2.value.length,s2.value.length); };
  const toggle = id=>{ wiz.checks[id]=!wiz.checks[id]; renderWiz2(); };
  $$("[data-wck]").forEach(b=> b.onclick=()=>toggle(b.dataset.wck));
  $$("[data-wrow]").forEach(r=> r.onclick=()=>toggle(r.dataset.wrow));
  $$("[data-wall]").forEach(b=> b.onclick=()=>{
    const m=b.dataset.wall;
    const list=S.exams.filter(x=>x.mod===m);
    const allOn=list.every(x=>wiz.checks[x.id]);
    list.forEach(x=> wiz.checks[x.id]=!allOn);
    renderWiz2();
  });
  $$("[data-wpx]").forEach(inp=>{
    inp.oninput = ()=>{ wiz.prices[inp.dataset.wpx]=inp.value; };
    inp.onclick = e=> e.stopPropagation();
  });
  $("#wzDone").onclick=finishWizard;
}
function finishWizard(){
  const convs = wiz.convs.split(",").map(s=>s.trim()).filter(Boolean);
  const list = convs.length? Array.from(new Set(convs)) : ["Padrão"];
  const firstConv = list[0];
  const id = "l"+(++S.locSeq);
  const examIds = Object.keys(wiz.checks).filter(k=>wiz.checks[k]);
  const taxV = parseMoney(String(wiz.taxPct||"")) || 0;
  S.locations.push({ id, name:wiz.name.trim(), slot:(S.locSeq-1)%8,
    convenios:list, mods:MODS.filter(m=>wiz.mods.has(m)), examIds,
    gross: !!wiz.gross, taxPct: wiz.gross? taxV : 0 });
  let nPriced=0;
  examIds.forEach(xid=>{
    const v = parseMoney(wiz.prices[xid]||"");
    if(v!=null && v>=0){ S.prices[pKey(id,xid,firstConv)] = v; nPriced++; }
  });
  save();
  locView = { locId:id, conv:firstConv, search:"", mode:null };
  toast(`Instituição criada · ${nPriced} preço${nPriced===1?"":"s"} definido${nPriced===1?"":"s"}`);
  render();
  window.scrollTo({top:0});
}

function renderLocs(){
  if(locView.mode==="wiz1") return renderWiz1();
  if(locView.mode==="wiz2") return renderWiz2();
  if(locView.locId && locById(locView.locId)) return renderLocDetail();
  locView = { locId:null, conv:null, search:"", mode:null };
  $("#view").innerHTML = `<div class="page">
    <div class="sec-head" style="margin-top:0"><h2>Locais de trabalho</h2>
      <button class="link sec-link" id="newLoc" style="background:none;color:var(--accent);font-weight:700;font-size:13.5px">+ Novo local</button></div>
    ${S.locations.length? `<div class="card" style="padding:4px 16px">${
      S.locations.map(l=>{
        const nPrices = Object.keys(S.prices).filter(k=>k.startsWith(l.id+"|")).length;
        return `<button class="lrow" style="width:100%;text-align:left" data-loc="${l.id}">
          <span class="dot" style="background:${SLOTS[l.slot]};width:12px;height:12px"></span>
          <div class="lr-main">
            <div class="lr-title">${esc(l.name)}</div>
            <div class="lr-sub">${(l.mods||[]).join(" · ")||"—"} · ${nPrices} preço${nPrices===1?"":"s"}</div>
            <div class="lr-sub" style="margin-top:1px">${l.convenios.map(esc).join(" · ")||"sem convênios"}</div>
          </div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>`;
      }).join("")}</div>`
    : emptyState("map","Nenhum local cadastrado","Cadastre cada clínica, hospital ou plantão onde você atua — os honorários são definidos por local e convênio.","Cadastrar local","newLoc2")}
    <div class="card">
      <div class="card-title">Catálogo de exames <span class="hint">${S.exams.length} exames</span></div>
      <p class="note" style="margin-bottom:12px">O catálogo é compartilhado entre os locais. Adicione exames que não estão na lista padrão.</p>
      <button class="btn btn-sm" id="newExam" style="width:100%">+ Adicionar exame ao catálogo</button>
    </div>
  </div>`;
  const nl=$("#newLoc"); if(nl) nl.onclick = ()=>startWizard();
  const nl2=$("#newLoc2"); if(nl2) nl2.onclick = ()=>startWizard();
  $$("[data-loc]").forEach(b=> b.onclick=()=>{ locView={locId:b.dataset.loc,conv:null,search:""}; renderLocs(); });
  $("#newExam").onclick = ()=> newExamSheet(()=>renderLocs());
}

function newLocSheet(editId){
  const l = locById(editId);
  if(!l) return startWizard();
  const selMods = new Set(l.mods||MODS);
  openSheet(`
    <h3>Editar instituição</h3>
    <div class="sheet-body">
      <div class="field"><label>Nome do local</label>
        <input class="input" id="nlName" placeholder="Ex.: Hospital São Lucas" value="${esc(l.name)}"></div>
      <div class="field"><label>Convênios atendidos (separe por vírgula)</label>
        <input class="input" id="nlConvs" placeholder="Ex.: Particular, Unimed, SUS" value="${esc(l.convenios.join(", "))}">
        <p class="note" style="margin-top:7px">Se os honorários não variam por convênio neste local, deixe em branco — será usado o convênio "Padrão".</p></div>
      <div class="field"><label>Modalidades presentes</label>${modCards(selMods,"nlm")}</div>
      <div class="field"><label>Os honorários são…</label>
        <div class="conv-chips">
          <button class="chip ${!l.gross?"on":""}" id="nlNet">Líquidos</button>
          <button class="chip ${l.gross?"on":""}" id="nlGross">Brutos (com descontos)</button>
        </div>
        <div id="nlTaxBox" class="${l.gross?"":"hidden"}" style="margin-top:10px">
          <input class="input" id="nlTax" inputmode="decimal" placeholder="% de desconto médio — ex.: 16" value="${l.taxPct||""}">
        </div>
      </div>
      <button class="btn btn-danger" id="nlDel">Excluir local</button>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="nlCancel">Cancelar</button>
      <button class="btn btn-primary" id="nlOk">Salvar</button>
    </div>`,
    el=>{
      $$("[data-nlm]",el).forEach(c=> c.onclick=()=>{
        const m=c.dataset.nlm;
        selMods.has(m)? selMods.delete(m) : selMods.add(m);
        c.classList.toggle("on", selMods.has(m));
      });
      let nlGross = !!l.gross;
      $("#nlNet",el).onclick=()=>{ nlGross=false; $("#nlNet",el).classList.add("on"); $("#nlGross",el).classList.remove("on"); $("#nlTaxBox",el).classList.add("hidden"); };
      $("#nlGross",el).onclick=()=>{ nlGross=true; $("#nlGross",el).classList.add("on"); $("#nlNet",el).classList.remove("on"); $("#nlTaxBox",el).classList.remove("hidden"); };
      $("#nlCancel",el).onclick=closeSheet;
      $("#nlDel",el).onclick=()=>{
        closeSheet();
        const nEnt = S.entries.filter(e=>e.locId===l.id).length;
        confirmSheet("Excluir "+l.name+"?",
          nEnt? `Este local tem ${nEnt} lançamentos no histórico, que também serão excluídos, junto com a tabela de preços.` :
          "A tabela de preços deste local será excluída.","Excluir tudo",()=>{
          S.locations=S.locations.filter(x=>x.id!==l.id);
          S.entries=S.entries.filter(e=>e.locId!==l.id);
          Object.keys(S.prices).forEach(k=>{ if(k.startsWith(l.id+"|")) delete S.prices[k]; });
          save(); locView={locId:null}; toast("Local excluído"); render();
        });
      };
      $("#nlOk",el).onclick=()=>{
        const name=$("#nlName",el).value.trim();
        if(!name){ toast("Dê um nome ao local"); return; }
        if(!selMods.size){ toast("Marque ao menos uma modalidade"); return; }
        const convs=$("#nlConvs",el).value.split(",").map(s=>s.trim()).filter(Boolean);
        l.name=name;
        l.convenios=convs.length?Array.from(new Set(convs)):["Padrão"]; // preços de convênios removidos são preservados
        l.mods=MODS.filter(m=>selMods.has(m));
        l.gross=nlGross;
        l.taxPct=nlGross? (parseMoney($("#nlTax",el).value)||0) : 0;
        save(); closeSheet(); toast("Local atualizado"); render();
      };
    });
}

function newExamSheet(after){
  openSheet(`
    <h3>Novo exame</h3>
    <div class="sheet-body">
      <div class="field"><label>Descrição do exame</label>
        <input class="input" id="nxName" placeholder="Ex.: USG de punho"></div>
      <div class="field"><label>Modalidade</label>
        <div class="conv-chips" id="nxMods">${activeMods().map((m,i)=>`<button class="chip ${i===0?"on":""}" data-m="${m}">${m} · ${esc(MOD_LABELS[m])}</button>`).join("")}</div></div>
      <div class="field"><label>Código TUSS (opcional)</label>
        <input class="input" id="nxCode" inputmode="numeric" placeholder="Ex.: 40901234"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="nxCancel">Cancelar</button>
      <button class="btn btn-primary" id="nxOk">Adicionar</button>
    </div>`,
    el=>{

function copyPricesSheet(){
  const l = locById(locView.locId);
  const sources=[];
  S.locations.forEach(sl=>{
    (sl.convenios.length?sl.convenios:["Padrão"]).forEach(c=>{
      if(sl.id===l.id && c===locView.conv) return;
      const n = S.exams.filter(x=>S.prices[pKey(sl.id,x.id,c)]!=null).length;
      if(n>0) sources.push([sl.id+"§"+c, sl.name+" · "+c+" ("+n+" preços)"]);
    });
  });
  if(!sources.length){ toast("Nenhuma outra tabela com preços"); return; }
  pickerSheet("Copiar preços de…", sources, null, v=>{
    const [srcLoc,srcConv]=v.split("§");
    let n=0;
    S.exams.forEach(x=>{
      const sv=S.prices[pKey(srcLoc,x.id,srcConv)];
      if(sv!=null){ S.prices[pKey(l.id,x.id,locView.conv)]=sv; n++; }
    });
    save(); toast(n+" preços copiados — ajuste o que precisar"); renderLocDetail();
  });
}

/* ================== SINCRONIZAÇÃO (merge de dados) ================== */
function mergeData(inc){
  const rep = {entries:0, locs:0, exams:0, prices:0, agenda:0};
  const mapExam = {}, mapLoc = {};
  // exames: casa por modalidade + nome normalizado
  (inc.exams||[]).forEach(xe=>{
    const mine = S.exams.find(x=>x.mod===xe.mod && normName(x.name)===normName(xe.name));
    if(mine){
      mapExam[xe.id]=mine.id;
      if(!mine.code && xe.code) mine.code=xe.code;
      if(!mine.alias && xe.alias) mine.alias=xe.alias;
      if(xe.fav) mine.fav=true;
    } else {
      const nid="x"+(++S.examSeq);
      S.exams.push({...xe, id:nid}); mapExam[xe.id]=nid; rep.exams++;
    }
  });
  // locais: casa por nome
  (inc.locations||[]).forEach(le=>{
    const mine = S.locations.find(l=>normName(l.name)===normName(le.name));
    if(mine){
      mapLoc[le.id]=mine.id;
      (le.convenios||[]).forEach(c=>{ if(!mine.convenios.includes(c)) mine.convenios.push(c); });
      (le.mods||[]).forEach(m=>{ if(!mine.mods.includes(m)) mine.mods.push(m); });
      (le.examIds||[]).forEach(i=>{ const mi=mapExam[i]; if(mi && !mine.examIds.includes(mi)) mine.examIds.push(mi); });
      if(le.gross && !mine.gross){ mine.gross=true; mine.taxPct=le.taxPct||0; }
    } else {
      const nid="l"+(++S.locSeq);
      S.locations.push({...le, id:nid, slot:(S.locSeq-1)%8,
        examIds:(le.examIds||[]).map(i=>mapExam[i]).filter(Boolean)});
      mapLoc[le.id]=nid; rep.locs++;
    }
  });
  // preços: preenche o que falta (valores locais têm prioridade)
  Object.entries(inc.prices||{}).forEach(([k,v])=>{
    const p=k.split("|");
    const nk=pKey(mapLoc[p[0]]||p[0], mapExam[p[1]]||p[1], p[2]);
    if(S.prices[nk]==null && locById(mapLoc[p[0]]||p[0])){ S.prices[nk]=v; rep.prices++; }
  });
  // lançamentos: união por assinatura (multiconjunto — não duplica, não perde)
  const sig=e=>[e.date,e.locId,e.examId,e.conv,e.qty,e.unit].join("|");
  const cnt=new Map();
  S.entries.forEach(e=>{ const k=sig(e); cnt.set(k,(cnt.get(k)||0)+1); });
  const incBy=new Map();
  (inc.entries||[]).forEach(ee=>{
    const ne={...ee, locId:mapLoc[ee.locId]||ee.locId, examId:mapExam[ee.examId]||ee.examId};
    if(!locById(ne.locId)) return;
    const k=sig(ne);
    if(!incBy.has(k)) incBy.set(k,[]);
    incBy.get(k).push(ne);
  });
  incBy.forEach((list,k)=>{
    const need = list.length - (cnt.get(k)||0);
    for(let i=0;i<need;i++){
      S.entries.push({...list[i], id:"e"+(++S.entrySeq)}); rep.entries++;
    }
  });
  // agenda: regras e eventos por assinatura
  const ag = inc.agenda||{};
  const rsig=r=>[r.dow,r.locId,r.period,r.start||"",r.end||"",r.from,r.freq||"w"].join("|");
  const rhave=new Set(S.agenda.rules.map(rsig));
  (ag.rules||[]).forEach(r=>{
    const nr={...r, id:"a"+(++S.agenda.seq), locId:mapLoc[r.locId]||r.locId};
    if(!locById(nr.locId) || rhave.has(rsig(nr))) return;
    rhave.add(rsig(nr)); S.agenda.rules.push(nr); rep.agenda++;
  });
  const esig=e=>[e.date,e.locId,e.period,e.start||""].join("|");
  const ehave=new Set(S.agenda.events.map(esig));
  (ag.events||[]).forEach(ev=>{
    const ne={...ev, id:"a"+(++S.agenda.seq), locId:mapLoc[ev.locId]||ev.locId};
    if(!locById(ne.locId) || ehave.has(esig(ne))) return;
    ehave.add(esig(ne)); S.agenda.events.push(ne); rep.agenda++;
  });
  if(inc.goal && !S.goal) S.goal=inc.goal;
  if(inc.userMods && !S.userMods) S.userMods=inc.userMods;
  return rep;
}

          <datalist id="specList">${specOptions()}</datalist></div>
        <div class="field"><label>Senha (opcional)</label>
          <input type="password" class="input" id="lgPwd" placeholder="Deixe em branco para entrar sem senha">
          <p class="note" style="margin-top:6px">A senha protege o acesso neste aparelho. Os dados de cada usuário ficam separados.</p></div>
        <button class="btn btn-primary" id="lgCreate">Criar e entrar</button>
        ${REG.list.length?'<button class="btn btn-ghost" id="lgBack" style="margin-top:8px">← Voltar</button>':""}
      </div></div>`;
    $("#lgCreate").onclick = async ()=>{
      const name=$("#lgName").value.trim();
      if(!name){ toast("Informe o nome"); return; }
      const prof = { id:"p"+(++REG.seq), name, crm:$("#lgCrm").value.trim(), spec:$("#lgSpec").value.trim() };
      const pwd=$("#lgPwd").value;
      if(pwd){ prof.salt=randSalt(); prof.hash=await hashPwd(prof.salt,pwd); }
      REG.list.push(prof); saveReg();
      enterProfile(prof.id);
      toast("Bem-vindo(a), "+name.split(" ")[0]+"!");
    };
    const bk=$("#lgBack"); if(bk) bk.onclick=()=>showLogin("pick");
    return;
  }
  // seleção de usuário
  el.innerHTML = `<div class="login-box">${logo}
    <p class="note txt-c" style="margin-bottom:14px;font-size:13px">Quem está usando?</p>
    ${REG.list.map(p=>`
      <button class="user-card" data-lg="${p.id}">
        <span class="avatar">${esc(initials(p.name))}</span>
        <span class="uc-main"><span class="uc-name" style="display:block">${esc(p.name)}</span>
        <span class="uc-sub">${esc([p.crm,p.spec].filter(Boolean).join(" · ")||"—")}</span></span>
        ${p.hash?'<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>':""}
      </button>`).join("")}
    <button class="btn" id="lgNew" style="margin-top:6px">+ Novo usuário</button>
    <div id="lgPwdBox"></div>
  </div>`;
  $$("[data-lg]").forEach(b=> b.onclick=()=>{
    const p = REG.list.find(x=>x.id===b.dataset.lg);
    if(!p) return;
    if(!p.hash){ enterProfile(p.id); return; }
    $("#lgPwdBox").innerHTML = `<div class="card" style="margin-top:12px">
      <div class="card-title">Senha de ${esc(p.name.split(" ")[0])}</div>
      <div class="input-row">
        <input type="password" class="input" id="lgTryPwd" placeholder="Senha">
        <button class="btn btn-primary" id="lgTry" style="flex:0 0 auto;width:auto;padding:0 20px;min-height:0">Entrar</button>
      </div><p class="note hidden" id="lgErr" style="margin-top:8px;color:var(--crit-text)">Senha incorreta.</p></div>`;
    const inp=$("#lgTryPwd"); inp.focus();
    const tryGo = async ()=>{
      const h = await hashPwd(p.salt||"", inp.value);
      if(h===p.hash) enterProfile(p.id);
      else $("#lgErr").classList.remove("hidden");
    };
    $("#lgTry").onclick=tryGo;
    inp.onkeydown=e=>{ if(e.key==="Enter") tryGo(); };
  });
  $("#lgNew").onclick=()=>showLogin("create");
}
function enterProfile(id){
  PID=id; REG.last=id; saveReg();
  // zera estados de sessão do perfil anterior
  draft.qty={}; draft.locId=null; draft.conv=null; draft.search="";
  locView.locId=null; locView.mode=null;
  F.loc=F.conv=F.mod=F.exam="all"; F.period="month";
  agView.sel=todayISO(); agView.y=null;
  load(); applyTheme(); updateUserBtn();
  $("#login").classList.add("hidden");
  tab="dash"; render();
}
function updateUserBtn(){
  const p=curProfile(), b=$("#userBtn");
  if(b) b.innerHTML = `<span class="avatar">${esc(p?initials(p.name):"?")}</span>`;
}
function userSheet(){
  const p=curProfile(); if(!p) return;
  openSheet(`
    <h3>Usuário</h3>
    <div class="sheet-body">
      <div class="user-card on" style="pointer-events:none">
        <span class="avatar">${esc(initials(p.name))}</span>
        <span class="uc-main"><span class="uc-name" style="display:block">${esc(p.name)}</span>
        <span class="uc-sub">${esc([p.crm,p.spec].filter(Boolean).join(" · ")||"—")}</span></span>
      </div>
      <button class="btn" id="usEdit" style="margin:10px 0">Editar perfil</button>
      <button class="btn" id="usSwitch" style="margin-bottom:10px">Trocar de usuário</button>
      <button class="btn" id="usNew">+ Novo usuário</button>
    </div>
    <div class="sheet-foot"><button class="btn" id="usClose">Fechar</button></div>`,
    el=>{
      $("#usClose",el).onclick=closeSheet;
      $("#usEdit",el).onclick=()=>{ closeSheet(); editProfileSheet(); };
      $("#usSwitch",el).onclick=()=>{ closeSheet(); showLogin("pick"); };
      $("#usNew",el).onclick=()=>{ closeSheet(); showLogin("create"); };
    });
}
function editProfileSheet(){
  const p=curProfile(); if(!p) return;
  openSheet(`
    <h3>Editar perfil</h3>
    <div class="sheet-body">
      <div class="field"><label>Nome completo</label><input class="input" id="epName" value="${esc(p.name)}"></div>
      <div class="field"><label>CRM</label><input class="input" id="epCrm" value="${esc(p.crm||"")}"></div>
      <div class="field"><label>Especialidade médica</label>
        <input class="input" id="epSpec" list="specList2" value="${esc(p.spec||"")}">
        <datalist id="specList2">${specOptions()}</datalist></div>
      <div class="field"><label>${p.hash?"Alterar senha (deixe em branco para manter)":"Definir senha (opcional)"}</label>
        <input type="password" class="input" id="epPwd" placeholder="Nova senha">
        ${p.hash?'<button id="epNoPwd" style="color:var(--crit-text);font-weight:700;font-size:12px;margin-top:8px">Remover senha</button>':""}</div>
      <button class="btn btn-danger" id="epDel">Excluir este usuário e seus dados</button>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="epCancel">Cancelar</button>
      <button class="btn btn-primary" id="epOk">Salvar</button>
    </div>`,
    el=>{
      $("#epCancel",el).onclick=closeSheet;
      const np=$("#epNoPwd",el); if(np) np.onclick=()=>{ delete p.hash; delete p.salt; saveReg(); closeSheet(); toast("Senha removida"); };
      $("#epDel",el).onclick=()=>{
        closeSheet();
        confirmSheet("Excluir "+p.name+"?","Todos os dados deste usuário (lançamentos, locais, agenda) serão apagados deste aparelho. Exporte um backup antes, se quiser guardar.","Excluir usuário",()=>{
          store.del(dbKey());
          REG.list=REG.list.filter(x=>x.id!==p.id);
          REG.last=null; saveReg(); PID=null;
          showLogin(REG.list.length?"pick":"create");
        });
      };
      $("#epOk",el).onclick=async ()=>{
        const name=$("#epName",el).value.trim();
        if(!name){ toast("Informe o nome"); return; }
        p.name=name; p.crm=$("#epCrm",el).value.trim(); p.spec=$("#epSpec",el).value.trim();
        const pwd=$("#epPwd",el).value;
        if(pwd){ p.salt=randSalt(); p.hash=await hashPwd(p.salt,pwd); }
        saveReg(); updateUserBtn(); closeSheet(); toast("Perfil atualizado");
        if(tab==="cfg") renderCfg();
      };
    });
}

/* ================== NAVEGAÇÃO / INIT ================== */
let tab="dash";
function nav(t){ tab=t; render(); window.scrollTo({top:0}); }
function render(){
  $("#tooltip").classList.remove("show");
  $$(".tab").forEach(b=> b.classList.toggle("on", b.dataset.tab===tab));
  if(tab==="dash") renderDash();
  else if(tab==="add") renderAdd();
  else if(tab==="agenda") renderAgenda();
  else if(tab==="hist"){ histLimit=15; renderHist(); }
  else if(tab==="locs") renderLocs();
  else if(tab==="cfg") renderCfg();
}
$$(".tab,[data-tab='add']").forEach(b=> b.addEventListener("click",()=>nav(b.dataset.tab)));
$("#cfgBtn").addEventListener("click",()=>nav("cfg"));
$("#themeBtn").addEventListener("click",()=>{
  if(!S) return;
  S.theme = S.theme==="dark"? "light":"dark";
  save(); applyTheme();
  toast(S.theme==="dark"? "Tema escuro":"Tema claro");
});
$("#userBtn").addEventListener("click",()=>{ if(S) userSheet(); });

(function init(){
  const d=new Date();
  $("#appbarDate").innerHTML = `<b>${WEEKDAYS[d.getDay()]}</b>${d.getDate()} ${MONTHS_S[d.getMonth()]}`;
  applyTheme(); // tema padrão antes do login
  loadReg();
  legacyMigrate();
  if(!REG.list.length){ showLogin("create"); return; }
  const last = REG.list.find(p=>p.id===REG.last);
  if(REG.list.length===1 && !REG.list[0].hash){ enterProfile(REG.list[0].id); return; }
  if(last && !last.hash){ enterProfile(last.id); return; }
  showLogin("pick");
})();
</script>
</body>
</html>
