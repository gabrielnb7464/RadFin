<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RadFin">
<meta name="theme-color" content="#f4f5f8">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="48" x2="48" y2="0"><stop offset="0" stop-color="%230d9488"/><stop offset="1" stop-color="%2334d399"/></linearGradient></defs><circle cx="24" cy="24" r="21" fill="none" stroke="url(%23g)" stroke-width="3.6"/><g stroke="url(%23g)" stroke-width="3.6" stroke-linecap="round"><line x1="14" y1="34" x2="14" y2="27"/><line x1="19" y1="34" x2="19" y2="19"/><line x1="24" y1="34" x2="24" y2="14.5"/><line x1="29" y1="34" x2="29" y2="21.5"/><line x1="34" y1="34" x2="34" y2="25.5"/></g></svg>'>
<title>RadFin — Honorários & Produtividade</title>
<style>
/* ================= TOKENS DE TEMA ================= */
:root, :root[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f5f8;
  --surface:#ffffff;
  --surface-2:#f6f7fa;
  --surface-3:#eef0f5;
  --border:#e9ebf1;
  --border-strong:#d7dbe6;
  --text:#101828;
  --text-2:#48546a;
  --muted:#98a2b3;
  --grid:#edeff4;
  --axis:#d5d9e2;
  --accent:#12b389;
  --accent-2:#2ec4a5;
  --accent-soft:#e5f7f1;
  --accent-text:#0b7d61;
  --accent-brd:#a4e5d3;
  --chip-on-bg:#e5f7f1; --chip-on-brd:#9adfc9; --chip-on-ink:#0b7d61;
  --good:#16a34a; --up:#15803d; --down:#dc2626;
  --warn:#d97706; --crit:#dc2626; --crit-text:#dc2626;
  --crit-soft:#fee2e2; --crit-brd:#fecaca;
  --s1:#2a78d6; --s2:#008300; --s3:#e87ba4; --s4:#eda100;
  --s5:#1baf7a; --s6:#eb6834; --s7:#4a3aa7; --s8:#e34948;
  --seq:#0d9488;
  --hero-bg:linear-gradient(135deg,#0e9c7c 0%,#12b389 55%,#2ec4a5 120%);
  --hero-ink:#ffffff; --hero-sub:rgba(255,255,255,.8); --hero-hl:#eafff6;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
  --shadow-lift:0 10px 30px rgba(18,179,137,.2);
  --tab-bg:rgba(255,255,255,.86);
  --veil:rgba(15,23,42,.4);
  --pop-bg:#ffffff; --pop-brd:#e2e5ee;
  --toast-bg:#101828; --toast-ink:#ffffff; --toast-ok:#6ee7a0;
  --glow1:rgba(18,179,137,.09); --glow2:rgba(46,196,165,.06);
  --k1-bg:#e5f7f1; --k1-ink:#0b7d61;
  --k2-bg:#eef0fe; --k2-ink:#4f46e5;
  --k3-bg:#fdf1e2; --k3-ink:#c2650a;
  --k4-bg:#f5ecfe; --k4-ink:#8b31d8;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c0d12;
  --surface:#17181f;
  --surface-2:#1f212b;
  --surface-3:#282b37;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.16);
  --text:#f6f7fb;
  --text-2:#c1c5d2;
  --muted:#878da0;
  --grid:#262933;
  --axis:#363a48;
  --accent:#2dd4b3;
  --accent-2:#4ade80;
  --accent-soft:rgba(20,184,166,.16);
  --accent-text:#8ceed7;
  --accent-brd:rgba(45,212,179,.42);
  --chip-on-bg:rgba(20,184,166,.18); --chip-on-brd:rgba(45,212,179,.5); --chip-on-ink:#9df0dd;
  --good:#22c55e; --up:#4ade80; --down:#f87171;
  --warn:#fbbf24; --crit:#ef4444; --crit-text:#fda4a4;
  --crit-soft:rgba(239,68,68,.14); --crit-brd:rgba(239,68,68,.4);
  --s1:#3987e5; --s2:#008300; --s3:#d55181; --s4:#c98500;
  --s5:#199e70; --s6:#d95926; --s7:#9085e9; --s8:#e66767;
  --seq:#2dd4b3;
  --hero-bg:linear-gradient(140deg,#0f3d34 0%,#11554a 45%,#101a19 110%);
  --hero-ink:#ffffff; --hero-sub:rgba(255,255,255,.68); --hero-hl:#8ef0c9;
  --shadow:0 8px 28px rgba(0,0,0,.35);
  --shadow-lift:0 10px 30px rgba(45,212,179,.28);
  --tab-bg:rgba(12,13,18,.8);
  --veil:rgba(0,0,0,.58);
  --pop-bg:#262833; --pop-brd:rgba(255,255,255,.14);
  --toast-bg:#262833; --toast-ink:#f6f7fb; --toast-ok:#6ee7a0;
  --glow1:rgba(45,212,179,.12); --glow2:rgba(74,222,128,.06);
  --k1-bg:rgba(45,212,179,.16); --k1-ink:#8ceed7;
  --k2-bg:rgba(129,140,248,.16); --k2-ink:#aab3ff;
  --k3-bg:rgba(251,191,36,.14); --k3-ink:#fcd34d;
  --k4-bg:rgba(167,139,250,.16); --k4-ink:#c4b5fd;
}
:root{
  --r-lg:20px; --r-md:15px; --r-sm:12px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100%;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background .25s;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(55% 30% at 16% -5%, var(--glow1), transparent 62%),
    radial-gradient(50% 28% at 88% -4%, var(--glow2), transparent 60%);
}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 96px)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
::placeholder{color:var(--muted)}
h1,h2,h3{font-weight:700;letter-spacing:-.02em}

/* ================= APPBAR ================= */
.appbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.appbar .brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:42px;height:42px;display:grid;place-items:center}
.brand-logo svg{width:42px;height:42px}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.03em}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.appbar-right{display:flex;align-items:center;gap:8px}
.appbar-date{font-size:12.5px;color:var(--text-2);text-align:right;line-height:1.35}
.appbar-date b{display:block;color:var(--text);font-size:13px;text-transform:capitalize}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--text-2);flex:0 0 auto;box-shadow:var(--shadow);transition:.15s}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{transform:scale(.94)}

/* ================= CARDS ================= */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card-title{font-size:13px;font-weight:700;color:var(--text-2);letter-spacing:.01em;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title .hint{font-size:11px;color:var(--muted);font-weight:500}

/* ================= HERO ================= */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);border:none;color:var(--hero-ink)}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.08);pointer-events:none}
.hero .label{font-size:12.5px;color:var(--hero-sub);font-weight:600}
.hero .value{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.06;margin:6px 0 2px;color:var(--hero-ink)}
.hero .value small{font-size:22px;font-weight:700;color:var(--hero-sub);letter-spacing:-.01em}
.hero .sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.hero .period-note{font-size:12px;color:var(--hero-sub)}
.hero .delta{background:rgba(255,255,255,.18);color:#fff}
.hero .delta.up{color:#b7f7cd}.hero .delta.down{color:#ffc9c9}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;
  padding:4px 9px;border-radius:99px;background:var(--surface-3)}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--text-2)}

/* ================= KPI ================= */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;
  box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start}
.kpi .k-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.kpi .k-ic svg{width:17px;height:17px}
.kpi .k-ic.k1{background:var(--k1-bg);color:var(--k1-ink)}
.kpi .k-ic.k2{background:var(--k2-bg);color:var(--k2-ink)}
.kpi .k-ic.k3{background:var(--k3-bg);color:var(--k3-ink)}
.kpi .k-ic.k4{background:var(--k4-bg);color:var(--k4-ink)}
.kpi .k-body{min-width:0}
.kpi .k-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.kpi .k-value{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.kpi .k-note{font-size:10.5px;color:var(--text-2);margin-top:2px}

/* ================= FILTROS ================= */
.filters{position:sticky;top:calc(var(--sat) + 4px);z-index:30;margin:0 -16px 12px;padding:6px 16px 10px;
  background:linear-gradient(to bottom,var(--bg) 82%,transparent)}
.chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:2px}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--text-2);
  background:var(--surface);border:1px solid var(--border);
  border-radius:99px;padding:8px 14px;min-height:36px;white-space:nowrap;
  box-shadow:var(--shadow);
  transition:background .15s,color .15s,border-color .15s;
}
.chip svg{width:13px;height:13px;opacity:.75}
.chip.on{background:var(--chip-on-bg);border-color:var(--chip-on-brd);color:var(--chip-on-ink)}
.chip.filter-active{background:var(--chip-on-bg);border-color:var(--accent);color:var(--chip-on-ink)}
.chip-row + .chip-row{margin-top:8px}

/* ================= GRÁFICOS ================= */
.chart-wrap{position:relative}
.chart-svg{display:block;width:100%;touch-action:pan-y}
.bar-col{transition:opacity .12s}
.bar-col.dim{opacity:.45}
.tooltip{
  position:absolute;z-index:50;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--pop-bg);border:1px solid var(--pop-brd);border-radius:12px;
  padding:9px 12px;box-shadow:0 10px 30px rgba(16,24,40,.18);min-width:120px;max-width:220px;
}
.tooltip.show{opacity:1}
.tooltip .tt-title{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
.tooltip .tt-val{font-size:15px;font-weight:800}
.tooltip .tt-sub{font-size:11.5px;color:var(--text-2);margin-top:2px}

.hbar-list{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center}
.hbar .hb-label{font-size:12.5px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.hbar .hb-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .hb-val{font-size:12.5px;font-weight:700;text-align:right}
.hbar .hb-sub{grid-column:2;font-size:10.5px;color:var(--muted);text-align:right}
.hbar .hb-track{grid-column:1/-1;height:10px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.hbar .hb-fill{height:100%;border-radius:0 6px 6px 0;min-width:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

.share-bar{display:flex;height:16px;border-radius:9px;overflow:hidden;gap:2px;background:var(--surface-3)}
.share-bar .seg-fill{min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);font-weight:600}

/* ================= RANKING ================= */
.rank-list{display:flex;flex-direction:column}
.rank-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.rank-item:last-child{border-bottom:none;padding-bottom:2px}
.rank-pos{width:26px;height:26px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;
  font-size:12px;font-weight:800;color:var(--text-2);flex:0 0 auto}
.rank-pos.first{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.rank-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-meta{font-size:11px;color:var(--muted);margin-top:2px}
.rank-val{text-align:right}
.rank-val b{font-size:14px;font-weight:800;display:block}
.rank-val small{font-size:10.5px;color:var(--muted)}

/* ================= METER / INSIGHTS ================= */
.meter-track{height:14px;border-radius:8px;background:var(--accent-soft);overflow:hidden;margin-top:10px}
.meter-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-top:7px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)}
.insight:last-child{border-bottom:none;padding-bottom:2px}
.insight .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:var(--accent-soft);color:var(--accent-text)}
.insight .ic svg{width:17px;height:17px;stroke:currentColor!important}
.insight .tx{flex:1;font-size:13px;color:var(--text-2);line-height:1.45}
.insight .tx b{color:var(--text)}

/* ================= FORMULÁRIOS ================= */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.input,select.input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:13px 14px;font-size:16px;outline:none;
  transition:border-color .15s;appearance:none;-webkit-appearance:none;color:var(--text);
}
.input:focus{border-color:var(--accent)}
.input-row{display:flex;gap:10px}
.input-row>*{flex:1}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:50px;border-radius:var(--r-md);font-size:15.5px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  transition:transform .1s,filter .15s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;box-shadow:var(--shadow-lift)}
.btn-danger{background:var(--crit-soft);border-color:var(--crit-brd);color:var(--crit-text)}
.btn-ghost{background:transparent}
.btn-sm{min-height:38px;font-size:13px;border-radius:11px;padding:0 14px;width:auto}
.btn:disabled{opacity:.45;pointer-events:none}
.search-box{position:relative;margin-bottom:12px}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search-box .input{padding-left:38px}

.stepper{display:flex;align-items:center;gap:0;background:var(--surface-3);border-radius:11px;overflow:hidden;flex:0 0 auto}
.stepper button{width:38px;height:38px;font-size:19px;font-weight:700;color:var(--text-2);display:grid;place-items:center}
.stepper button:active{background:var(--border-strong)}
.stepper .qty{min-width:30px;text-align:center;font-size:15px;font-weight:800}
.stepper .qty.zero{color:var(--muted);font-weight:600}

.lrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:none}
.lrow .lr-main{flex:1;min-width:0}
.lrow .lr-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lr-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.lrow .lr-side{text-align:right;flex:0 0 auto}
.lrow .lr-side b{display:block;font-size:14px;font-weight:700}
.lrow .lr-side small{font-size:11px;color:var(--muted)}
.chev{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text-2);
  background:var(--surface-3);border-radius:7px;padding:3px 8px}

.price-input{width:108px;background:var(--surface-3);border:1px solid transparent;border-radius:10px;
  padding:9px 10px;font-size:15px;font-weight:700;text-align:right;outline:none;color:var(--text)}
.price-input:focus{border-color:var(--accent);background:var(--surface-2)}
.price-input.noval{color:var(--muted);font-weight:500}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec-head h2{font-size:17px}
.sec-head .link{font-size:13px;font-weight:700;color:var(--accent-text)}
.mod-head{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:16px 0 4px}

/* ================= EMPTY ================= */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 20px;gap:12px}
.empty .em-ic{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);display:grid;place-items:center}
.empty .em-ic svg{width:30px;height:30px;color:var(--accent)}
.empty h3{font-size:16px}
.empty p{font-size:13px;color:var(--muted);line-height:1.5;max-width:280px}
.empty .btn{max-width:260px}

/* ================= TAB BAR ================= */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:flex;justify-content:center;
  padding:8px 12px calc(var(--sab) + 8px);
  background:var(--tab-bg);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border-top:1px solid var(--border);
}
.tabbar-inner{display:flex;width:100%;max-width:520px;align-items:flex-end}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--muted);min-height:48px;justify-content:center}
.tab svg{width:23px;height:23px}
.tab span{font-size:10px;font-weight:600}
.tab.on{color:var(--accent)}
.tab-fab{flex:1;display:flex;justify-content:center;align-items:center}
.fab{
  width:56px;height:56px;border-radius:19px;display:grid;place-items:center;margin-top:-22px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:var(--shadow-lift);transition:transform .12s;
}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}

/* ================= SHEET ================= */
.sheet-veil{position:fixed;inset:0;z-index:80;background:var(--veil);opacity:0;transition:opacity .22s;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-veil.show{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:81;max-width:520px;margin:0 auto;
  background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--border);border-bottom:none;
  padding:10px 18px calc(var(--sab) + 20px);
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,.25,1);
  max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  box-shadow:0 -12px 40px rgba(16,24,40,.18);
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--surface-3);margin:4px auto 14px;flex:0 0 auto}
.sheet h3{font-size:17px;margin-bottom:14px;flex:0 0 auto}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding-bottom:6px}
.sheet-foot{flex:0 0 auto;padding-top:12px;display:flex;gap:10px}

/* ================= MISC ================= */
.toast{
  position:fixed;left:50%;bottom:calc(var(--sab) + 100px);transform:translate(-50%,16px);z-index:99;
  background:var(--toast-bg);border:1px solid var(--pop-brd);color:var(--toast-ink);
  font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:99px;
  box-shadow:0 10px 30px rgba(16,24,40,.3);opacity:0;transition:all .25s;white-space:nowrap;
  display:flex;align-items:center;gap:8px;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;color:var(--toast-ok)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 4px}
.day-head .dh-date{font-size:13px;font-weight:700}
.day-head .dh-date::first-letter{text-transform:uppercase}
.day-head .dh-total{font-size:12.5px;font-weight:700;color:var(--accent-text)}
.conv-chips{display:flex;flex-wrap:wrap;gap:8px}
.total-bar{
  position:sticky;bottom:calc(var(--sab) + 88px);z-index:40;margin-top:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:var(--r-md);
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  color:#fff;box-shadow:var(--shadow-lift);cursor:pointer;gap:12px;
}
.total-bar .tb-l{font-size:13px;font-weight:700;flex:1;min-width:0;text-align:left}
.total-bar .tb-l small{display:block;font-size:11px;color:rgba(255,255,255,.75);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.total-bar .tb-r{font-size:17px;font-weight:800;flex:0 0 auto}
.page{animation:pgin .25s ease}
@keyframes pgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.mut{color:var(--muted)}
.txt-c{text-align:center}
.mb0{margin-bottom:0}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.swatch-row{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:12px;border:2px solid transparent;transition:transform .12s}
.swatch.on{border-color:var(--text);transform:scale(1.1)}

/* ================= VOZ & FAVORITOS ================= */
.mic-btn{
  width:52px;height:52px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  display:grid;place-items:center;box-shadow:var(--shadow-lift);
  transition:transform .12s;
}
.mic-btn:active{transform:scale(.94)}
.mic-btn svg{width:22px;height:22px}
.mic-live{
  width:86px;height:86px;border-radius:50%;margin:10px auto 14px;
  background:var(--accent-soft);display:grid;place-items:center;position:relative;
}
.mic-live svg{width:36px;height:36px;color:var(--accent)}
.mic-live.rec::before{content:"";position:absolute;inset:-8px;border-radius:50%;
  border:2px solid var(--accent-brd);animation:micpulse 1.4s ease-out infinite}
@keyframes micpulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.25);opacity:0}}
.transcript{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:12px 14px;font-size:14px;line-height:1.5;min-height:64px;color:var(--text-2);
}
.transcript .interim{color:var(--muted);font-style:italic}
.fav-btn{width:34px;height:38px;display:grid;place-items:center;color:var(--border-strong);flex:0 0 auto}
.fav-btn svg{width:17px;height:17px}
.fav-btn.on{color:#f5b301}
.vc-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.vc-item:last-child{border-bottom:none}
.vc-item .vc-main{flex:1;min-width:0}
.vc-item .vc-name{font-size:13.5px;font-weight:700;white-space:normal;line-height:1.3}
.vc-item .vc-sub{font-size:11px;color:var(--muted);margin-top:2px}
.vc-item.miss .vc-name{color:var(--warn)}

/* ================= MODALIDADES ================= */
.modgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modcard{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:14px;padding:13px 12px;text-align:left;transition:border-color .15s,background .15s;min-height:58px}
.modcard.on{border-color:var(--accent);background:var(--accent-soft)}
.modcard .mc-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);
  display:grid;place-items:center;flex:0 0 auto;transition:.15s;color:transparent}
.modcard.on .mc-check{background:var(--accent);border-color:var(--accent);color:#fff}
.modcard .mc-check svg{width:13px;height:13px}
.modcard b{display:block;font-size:14.5px;letter-spacing:-.01em}
.modcard small{font-size:10.5px;color:var(--muted);font-weight:600}
.modcard.on small{color:var(--accent-text)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;
  flex:0 0 auto;color:transparent;transition:.13s}
.ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ck svg{width:14px;height:14px}
.wiz-steps{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.wiz-steps .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;
  background:var(--surface-3);color:var(--muted)}
.wiz-steps .st.on{background:var(--accent);color:#fff}
.wiz-steps .ln{flex:1;height:2px;background:var(--surface-3);border-radius:1px}
.wiz-steps .ln.on{background:var(--accent)}
.wiz-steps span{font-size:11.5px;color:var(--muted);font-weight:600}

/* ================= CALENDÁRIO ================= */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-title{font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.cal-title::first-letter{text-transform:uppercase}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:34px;height:34px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;color:var(--text-2)}
.cal-nav button svg{width:15px;height:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding:2px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.cal-cell{aspect-ratio:.86;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--text-2);border:1px solid transparent;padding:2px 0;position:relative}
.cal-cell.out{opacity:.28}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.sel{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-brd)}
.cal-cell .cd{display:flex;gap:2.5px;height:5px}
.cal-cell .cd i{width:5px;height:5px;border-radius:50%;display:block}
.cal-cell .pb{width:13px;height:2.5px;border-radius:2px;background:var(--accent);position:absolute;bottom:5px}
.cal-cell .cd .more{font-size:7.5px;line-height:5px;color:var(--muted);font-weight:800}

/* ================= SEMANA / PROJEÇÃO ================= */
.wk-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.wk-row:last-child{border-bottom:none}
.wk-day{width:40px;flex:0 0 auto;text-align:center}
.wk-day b{display:block;font-size:15px;letter-spacing:-.01em}
.wk-day span{font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase}
.wk-day.today b{color:var(--accent-text)}
.wk-main{flex:1;min-width:0}
.wk-main .wk-loc{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--text-2)}
.wk-main .wk-loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-main .wk-free{font-size:12px;color:var(--muted)}
.wk-val{text-align:right;flex:0 0 auto}
.wk-val b{display:block;font-size:13px;font-weight:800}
.wk-val small{font-size:10px;color:var(--muted)}
.wk-val.done b{color:var(--up)}
.wk-tot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.wk-tot .wt{text-align:center;flex:1}
.wk-tot .wt b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.wk-tot .wt span{font-size:10px;color:var(--muted);font-weight:600}
.proj-total{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:2px 0 10px}
.proj-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface-3);margin-bottom:12px}
.proj-bar i{display:block;min-width:3px}
.proj-leg{display:flex;flex-direction:column;gap:8px}
.proj-leg .pl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.proj-leg .pl .dot{width:9px;height:9px;border-radius:3px}
.proj-leg .pl b{margin-left:auto;color:var(--text);font-weight:700;font-size:13px}
/* ================= LOGIN / USUÁRIOS ================= */
.login{position:fixed;inset:0;z-index:120;background:var(--bg);overflow-y:auto;
  display:flex;align-items:center;justify-content:center;padding:26px 20px}
.login-box{width:100%;max-width:380px;animation:pgin .3s ease}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:24px;text-align:center}
.login-logo svg{width:64px;height:64px}
.login-logo h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.login-logo p{font-size:12.5px;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
.user-card{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--r-md);padding:13px 14px;margin-bottom:10px;
  box-shadow:var(--shadow);text-align:left;transition:border-color .15s}
.user-card:active{border-color:var(--accent)}
.user-card .uc-main{flex:1;min-width:0}
.user-card .uc-name{font-weight:700;font-size:15px}
.user-card .uc-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.user-card.on{border-color:var(--accent);background:var(--accent-soft)}
.user-card .lock{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
#userBtn .avatar{width:30px;height:30px;font-size:11.5px}
@media (min-width:520px){ body{padding-top:10px} }
</style>
</head>

<script>
"use strict";
/* ================== STORAGE (safe wrapper) ================== */
const store = {
  ok: (() => { try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; } catch(e){ return false; } })(),
  mem: {},
  get(k){ if(this.ok){ try { return localStorage.getItem(k); } catch(e){} } return (k in this.mem) ? this.mem[k] : null; },
  set(k,v){ if(this.ok){ try { localStorage.setItem(k,v); return; } catch(e){} } this.mem[k]=v; },
  del(k){ if(this.ok){ try { localStorage.removeItem(k); } catch(e){} } delete this.mem[k]; }
};
/* ================== USUÁRIOS (perfis locais) ================== */
const REG_KEY = "radfin.profiles";
let REG = { list:[], last:null, seq:0 };
let PID = null; // perfil ativo
function loadReg(){
  try{ REG = JSON.parse(store.get(REG_KEY)) || {list:[],last:null,seq:0}; }catch(e){ REG={list:[],last:null,seq:0}; }
  if(!Array.isArray(REG.list)) REG={list:[],last:null,seq:0};
  if(typeof REG.seq!=="number") REG.seq = REG.list.length;
}
function saveReg(){ store.set(REG_KEY, JSON.stringify(REG)); }
function legacyMigrate(){
  const legacy = store.get("radfin.v1");
  if(legacy && !REG.list.length){
    const id = "p"+(++REG.seq);
    REG.list.push({id, name:"Meu perfil", crm:"", spec:""});
    REG.last = id;
    store.set("radfin.v1."+id, legacy);
    store.del("radfin.v1");
    saveReg();
  }
}
function dbKey(){ return "radfin.v1."+PID; }
function curProfile(){ return REG.list.find(p=>p.id===PID) || null; }
function initials(name){
  const w = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!w.length) return "?";
  return (w[0][0] + (w.length>1? w[w.length-1][0] : "")).toUpperCase();
}
async function hashPwd(salt, pwd){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+"|"+pwd));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h=5381; const s2=salt+"|"+pwd;
    for(let i=0;i<s2.length;i++) h=((h<<5)+h+s2.charCodeAt(i))|0;
    return "djb2:"+(h>>>0).toString(16);
  }
}
function randSalt(){
  const a = new Uint8Array(8);
  try{ crypto.getRandomValues(a); }catch(e){ for(let i=0;i<8;i++) a[i]=(i*37+13)%256; }
  return Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const SPECS = ["Radiologia e Diagnóstico por Imagem","Ultrassonografia Geral","Medicina Fetal",

   Nomes baseados no Rol ANS / nomenclatura TUSS. O campo `code`

const MODS = ["US","DO","RX","TC","RM","MMG","DMO","PROCED"];

};
const CATALOG_SEED = [
  /* Base: TABELA DE PREÇOS DE EXAMES (enviada pelo usuário, com códigos TUSS).
     RM e DMO mantidos da base Rol ANS (sem código na tabela). Formato: [modalidade, descrição, códigoTUSS] */
  /* US */
  ["US","ABDOME INFERIOR FEMININO (BEXIGA, UTERO, OVARIO E ANEXOS)","40901181"],
  ["US","ABDOME INFERIOR MASCULINO (BEXIGA, PROSTATA E VESICULAS SEMINAIS)","40901173"],
  ["US","ABDOME SUPERIOR (FIGADO, VIAS BILIARES, VESICULA, PANCREAS E BACO)","40901130"],

  ["US","APARELHO URINARIO (RINS, URETERES E BEXIGA)","40901769"],
  ["US","ARTICULAR (POR ARTICULACAO)","40901220"],
  ["US","DERMATOLOGICO - PELE E SUBCUTANEO","40901190"],
  ["US","ESTRUTURAS SUPERFICIAIS (CERVICAL OU AXILAS OU MUSCULO OU TENDAO)","40901211"],
  ["US","GLANDULAS SALIVARES (TODAS)","40901033"],
  ["US","GLOBO OCULAR BILATERAL","40901017"],
  ["US","MAMAS","40901114"],
  ["US","OBSTETRICA","40901238"],
  ["US","OBSTETRICA 1º TRIMESTRE (ENDOVAGINAL)","40901297"],
  ["US","OBSTETRICA COM TRANSLUCENCIA NUCAL","40901254"],
  ["US","OBSTETRICA GESTACAO MULTIPLA (CADA FETO)","40901270"],
  ["US","OBSTETRICA MORFOLOGICA","40901262"],
  ["US","OBSTETRICA: PERFIL BIOFISICO FETAL","40901505"],
  ["US","ORGAOS SUPERFICIAIS (TIREOIDE OU ESCROTO OU PENIS OU CRANIO)","40901203"],

function applyAliases(exams){
  exams.forEach(x=>{
    if(x.alias) return;
    const nn = normName(x.name);
    if(x.code==="40901173"){ x.alias = nn.includes("prostata via abdominal")? "Pr\u00f3stata (via abdominal)":"Abd. inferior masculino"; return; }
    const v2 = nn.includes("2a lesao")||nn.includes("2o nodulo")||nn.includes("2 lesao")||nn.includes("2 nodulo");
    if(nn.includes("core biopsy")){ x.alias = v2? "Core biopsy (2\u00aa les\u00e3o+)":"Core biopsy de mama"; return; }
    if(nn.includes("mamotomia")){ x.alias = v2? "Mamotomia (2\u00aa les\u00e3o+)":"Mamotomia"; return; }
    if(nn.includes("agulha fina")){ x.alias = v2? "PAAF de mama (2\u00ba n\u00f3dulo+)":"PAAF de mama"; return; }
    if(nn.includes("ato de coleta")){ x.alias = v2? "Coleta de PAAF (2\u00ba n\u00f3dulo+)":"Coleta de PAAF"; return; }
    if(nn.includes("aspirativa de orgao")){ x.alias = v2? "Bi\u00f3psia/PAAF superficial (2\u00aa+)":"Bi\u00f3psia/PAAF superficial"; return; }
    if(x.code && ALIAS_BY_CODE[x.code]) x.alias = ALIAS_BY_CODE[x.code];
  });
}
const dispName = x => x? (x.alias || x.name) : "";

function examSearchText(x){ return normName(x.name+" "+(x.alias||"")+" "+(x.code||"")); }
function expandTokens(q){
  return normName(q).split(" ").map(t=> ABBR[t]!==undefined? ABBR[t] : t).filter(Boolean);
}
function matchExam(x,q){
  if(!q||!q.trim()) return true;
  const txt = examSearchText(x);
  const toks = expandTokens(q);
  if(!toks.length) return true;
  return toks.every(t=> txt.includes(t));
}

function migrate(){
  if(!S.agenda || !Array.isArray(S.agenda.rules)) S.agenda = { events:[], rules:[], skips:[], seq:0 };
  if(!Array.isArray(S.agenda.events)) S.agenda.events=[];
  if(!Array.isArray(S.agenda.skips)) S.agenda.skips=[];
  if(typeof S.agenda.seq!=="number") S.agenda.seq=0;
  // v4: catálogo oficial (tabela do usuário, com códigos TUSS)
  if(!S.catalogV || S.catalogV<4){
    const remap = {USG:"US", Doppler:"DO", Outros:"PROCED"};
    S.exams.forEach(x=>{ if(remap[x.mod]) x.mod = remap[x.mod]; });
    // 1. renomeia exames conhecidos para a nomenclatura oficial (mantém id, preços e histórico)
    RENAMES_V4.forEach(([om,on,nn])=>{
      const sEntry = CATALOG_SEED.find(c=>c[1]===nn);
      if(!sEntry) return;
      const ex = S.exams.find(x=>x.mod===om && normName(x.name)===normName(on));
      if(!ex) return;
      const already = S.exams.find(x=>x!==ex && x.mod===sEntry[0] && normName(x.name)===normName(nn));
      if(already) return; // destino já existe — o antigo segue as regras de limpeza abaixo
      ex.mod=sEntry[0]; ex.name=sEntry[1]; if(sEntry[2]) ex.code=sEntry[2];
    });
    // 2. remove do catálogo exames antigos sem uso (sem lançamentos e sem preços) fora da base nova
    const used = new Set(S.entries.map(e=>e.examId));
    Object.keys(S.prices).forEach(k=>used.add(k.split("|")[1]));
    const v4 = new Set(CATALOG_SEED.map(c=>c[0]+"§"+normName(c[1])));
    S.exams = S.exams.filter(x=> used.has(x.id) || v4.has(x.mod+"§"+normName(x.name)));
    // 3. adiciona os que faltam (comparação sem acentos/caixa evita duplicatas)
    CATALOG_SEED.forEach(c=>{
      if(!S.exams.some(e=>e.mod===c[0] && normName(e.name)===normName(c[1]))){
        const o={id:"x"+(++S.examSeq), mod:c[0], name:c[1]}; if(c[2]) o.code=c[2];
        S.exams.push(o);
      }
    });
    // 4. anexa códigos TUSS a exames existentes que ainda não têm
    S.exams.forEach(x=>{
      if(x.code) return;
      const c = CATALOG_SEED.find(s=>s[0]===x.mod && normName(s[1])===normName(x.name));
      if(c && c[2]) x.code=c[2];
    });
    S.catalogV = 4;
  }
  // v5: apelidos curtos padrão para nomes TUSS longos
  if(S.catalogV<5){ applyAliases(S.exams); S.catalogV=5; }
  if(S.userMods===undefined) S.userMods = null;
  if(S.theme!=="dark" && S.theme!=="light") S.theme="light";
  S.entries.forEach(e=>{ if(e.paid===undefined) e.paid=false; });
  // v4: turnos matutino/vespertino/noturno + integração com agenda
  const perRemap = {"Manhã":"Matutino","Tarde":"Vespertino","Noite":"Noturno"};
  S.agenda.rules.forEach(r=>{ if(perRemap[r.period]) r.period=perRemap[r.period]; });
  S.agenda.events.forEach(e=>{ if(perRemap[e.period]) e.period=perRemap[e.period]; });
  if(!S.cal || typeof S.cal!=="object") S.cal = { reminder:60, weekly:false, prompt:true };
  if(S.cal.reminder===undefined) S.cal.reminder=60;
  if(S.cal.weekly===undefined) S.cal.weekly=false;
  if(S.cal.prompt===undefined) S.cal.prompt=true;
  S.locations.forEach(l=>{
    if(l.gross===undefined) l.gross=false;      // honorários em valor bruto?
    if(typeof l.taxPct!=="number") l.taxPct=0;  // % de desconto (impostos/NF)
    if(!Array.isArray(l.mods) || !l.mods.length){
      // infere pelas tabelas de preço já existentes; senão, todas
      const used = new Set();
      Object.keys(S.prices).forEach(k=>{
        if(k.startsWith(l.id+"|")){ const x=examById(k.split("|")[1]); if(x) used.add(x.mod); }
      });
      l.mods = used.size? Array.from(used) : MODS.slice();
    }
    if(!Array.isArray(l.examIds)) l.examIds = [];
  });
}

  if(raw){ try { S = JSON.parse(raw); } catch(e){ S = null; } }

/* ================== AGENDA (compromissos) ================== */
const PERIODS = ["Matutino","Vespertino","Noturno","Dia inteiro"];
const PERIOD_TIMES = { Matutino:["07:00","13:00",false], Vespertino:["13:00","19:00",false], Noturno:["19:00","07:00",true] };
function occTimes(o){
  if(o.start && o.end) return {allDay:false, start:o.start, end:o.end, endNext:o.end<=o.start};
  const pt = PERIOD_TIMES[o.period];
  if(pt) return {allDay:false, start:pt[0], end:pt[1], endNext:pt[2]};
  return {allDay:true};
}
function occLabel(o){
  if(o.start && o.end) return o.start+" – "+o.end;
  return o.period;
}
function occurrences(date){
  const dow = fromISO(date).getDay();
  const evs = S.agenda.events.filter(e=>e.date===date)
    .map(e=>({id:e.id, date, locId:e.locId, period:e.period, start:e.start, end:e.end, note:e.note, type:"event"}));
  const rls = S.agenda.rules.filter(r=>{
      if(r.from>date || (r.until && date>=r.until)) return false;
      if(S.agenda.skips.some(s=>s.ruleId===r.id && s.date===date)) return false;
      const f = r.freq||"w";
      if(f==="m") return fromISO(date).getDate()===fromISO(r.from).getDate();
      if(r.dow!==dow) return false;
      if(f==="2w"){
        const weeks = Math.round((fromISO(date)-fromISO(r.from))/(86400000*7));
        return weeks%2===0;
      }
      return true;
    })
    .map(r=>({id:r.id, date, locId:r.locId, period:r.period, start:r.start, end:r.end, note:r.note, freq:r.freq||"w", type:"rule"}));
  return evs.concat(rls).filter(o=>locById(o.locId));
}
function hasAgendaData(){ return S.agenda.events.length>0 || S.agenda.rules.length>0; }
/* bruto → líquido */
function netFactor(locId){
  const l = locById(locId);
  return (l && l.gross && l.taxPct>0)? (1 - Math.min(99,l.taxPct)/100) : 1;
}

const pad2 = n => String(n).padStart(2,"0");

  const d=fromISO(iso), t=todayISO();

function parseMoney(s){
  if(typeof s!=="string") return null;
  s = s.trim().replace(/[R$\s]/g,"");
  if(!s) return null;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");

<script>
"use strict";
/* ================== FILTROS DO DASHBOARD ================== */
const F = { period:"month", from:null, to:null, loc:"all", conv:"all", mod:"all", exam:"all" };

function periodRange(){
  const t = todayISO(), d = new Date();
  switch(F.period){
    case "today": return [t,t,"Hoje"];
    case "7d":    return [addDays(t,-6),t,"Últimos 7 dias"];
    case "30d":   return [addDays(t,-29),t,"Últimos 30 dias"];
    case "month": return [toISO(new Date(d.getFullYear(),d.getMonth(),1)),t,"Este mês"];
    case "pmonth":{
      const f=new Date(d.getFullYear(),d.getMonth()-1,1), l=new Date(d.getFullYear(),d.getMonth(),0);
      return [toISO(f),toISO(l),"Mês passado"];
    }
    case "90d":  return [addDays(t,-89),t,"Últimos 90 dias"];
    case "year": return [toISO(new Date(d.getFullYear(),0,1)),t,"Este ano"];
    case "all":  {
      const ds = S.entries.map(e=>e.date).sort();
      return [ds[0]||t, t, "Todo o período"];
    }
    case "custom": return [F.from||t, F.to||t, fmtDateShort(F.from||t)+" – "+fmtDateShort(F.to||t)];
  }
  return [t,t,""];
}
function entryValue(e){ return (e.unit||0)*e.qty; }
function filteredEntries(range){
  const [from,to] = range || periodRange();
  return S.entries.filter(e=>{
    if(e.date<from || e.date>to) return false;
    if(F.loc!=="all" && e.locId!==F.loc) return false;
    if(F.conv!=="all" && e.conv!==F.conv) return false;
    if(F.mod!=="all"){ const x=examById(e.examId); if(!x||x.mod!==F.mod) return false; }
    if(F.exam!=="all" && e.examId!==F.exam) return false;
    return true;
  });
}
function sumBy(arr, keyFn){
  const m = new Map();
  arr.forEach(e=>{
    const k = keyFn(e);
    const cur = m.get(k)||{v:0,q:0};
    cur.v += entryValue(e); cur.q += e.qty;
    m.set(k,cur);
  });
  return m;
}

    const pc = (total-prevTotal)/prevTotal*100;

        <div class="tx">Sua semana: <b>${nOcc} plantã${nOcc===1?"o":"es"}</b> agendado${nOcc===1?"":"s"}, previsto <b>${compact(exp)}</b>.</div>
      </div>
      <button id="wkGo" class="btn btn-sm" style="flex:0 0 auto">Ver agenda</button>
    </section>`;

  // HERO (com líquido estimado quando há locais com honorário bruto)
  const totalNet = ent.reduce((s,e)=>s+entryValue(e)*netFactor(e.locId),0);
  html += `
  <section class="card hero">
    <div class="label">Faturamento · ${esc(label)}</div>
    <div class="value">${heroMoney(total)}</div>
    <div class="sub">${deltaHtml}</div>
    ${total-totalNet>0.5?`<div class="period-note" style="margin-top:8px">Líquido estimado após descontos: <b style="color:var(--hero-hl)">${fmtBRL0(totalNet)}</b></div>`:""}
  </section>`;

  // KPIs
  const ticket = nEx? total/nEx : 0;
  const daily  = days? total/days : 0;
  const kIc = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  html += `
  <section class="kpi-grid">
    <div class="kpi"><div class="k-ic k1">${kIc('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>')}</div>
      <div class="k-body"><div class="k-label">Exames laudados</div><div class="k-value">${fmtN(nEx)}</div><div class="k-note">${days} dia${days===1?"":"s"} com produção</div></div></div>
    <div class="kpi"><div class="k-ic k2">${kIc('<path d="M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 1.8 2.6 5 3.3 5 1.6 5 3.7-2.2 3-5 3-5-1.1-5-3"/>')}</div>
      <div class="k-body"><div class="k-label">Ticket médio / exame</div><div class="k-value">${fmtBRL(ticket)}</div><div class="k-note">média no período</div></div></div>
    <div class="kpi"><div class="k-ic k3">${kIc('<path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/>')}</div>
      <div class="k-body"><div class="k-label">Média / dia produtivo</div><div class="k-value">${compact(daily)}</div><div class="k-note">${fmtN(days?Math.round(nEx/days):0)} exames/dia</div></div></div>
    <div class="kpi"><div class="k-ic k4">${kIc('<path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/>')}</div>
      <div class="k-body"><div class="k-label">Locais ativos</div><div class="k-value">${new Set(ent.map(e=>e.locId)).size}</div><div class="k-note">de ${S.locations.length} cadastrado${S.locations.length===1?"":"s"}</div></div></div>
  </section>`;

  if(ent.length===0){
    html += emptyState("chart","Sem lançamentos no período",
      hasData? "Ajuste os filtros acima ou lance a volumetria de hoje no botão +." :
      "Toque no botão + para lançar sua primeira volumetria diária.",
      "Lançar exames","goAdd");
    $("#view").innerHTML = html;
    bindFilters();
    const g=$("#goAdd"); if(g) g.onclick=()=>nav("add");
    return;
  }

  // META + PROJEÇÃO (sempre sobre o mês corrente, independe dos filtros)
  const mp = monthProjection();
  const dNow = new Date();
  if(S.goal>0){
    const pct = Math.min(100, mp.realized/S.goal*100);
    html += `
    <section class="card">
      <div class="card-title">Meta do mês <span class="hint">${MONTHS_S[dNow.getMonth()]}/${dNow.getFullYear()}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <b style="font-size:20px;letter-spacing:-.02em">${fmtBRL0(mp.realized)}</b>
        <span class="mut" style="font-size:12px">meta ${fmtBRL0(S.goal)}</span>
      </div>
      <div class="meter-track"><div class="meter-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="meter-row"><span>${pct.toLocaleString("pt-BR",{maximumFractionDigits:0})}% atingido</span><span>projeção: <b style="color:${mp.total>=S.goal?"var(--up)":"var(--text)"}">${compact(mp.total)}</b></span></div>
    </section>`;
  }
  html += projectionCard(mp);
  html += paymentsCard(ent, from, to);
  html += monthCompareCard();

  // GRÁFICO DE FATURAMENTO NO TEMPO
  html += `
  <section class="card">
    <div class="card-title">Faturamento no período <span class="hint">toque nas barras</span></div>
    <div class="chart-wrap" id="tsChart"></div>
  </section>`;

  // PESO POR LOCAL (share bar) + RANKING
  const byLoc = sumBy(ent, e=>e.locId);
  const locRank = Array.from(byLoc.entries())
    .map(([id,d])=>({loc:locById(id), ...d}))
    .filter(r=>r.loc)
    .sort((a,b)=>b.v-a.v);
  if(locRank.length>0){
    const shareSegs = locRank.map(r=>`<div class="seg-fill" style="flex:${r.v||0.0001};background:${SLOTS[r.loc.slot]}"></div>`).join("");
    const legend = locRank.map(r=>`<span class="lg"><span class="dot" style="background:${SLOTS[r.loc.slot]}"></span>${esc(r.loc.name)} · ${(r.v/total*100).toLocaleString("pt-BR",{maximumFractionDigits:0})}%</span>`).join("");
    html += `
    <section class="card">
      <div class="card-title">Peso por local de trabalho</div>
      <div class="share-bar">${shareSegs}</div>
      <div class="legend">${legend}</div>
    </section>
    <section class="card">
      <div class="card-title">Ranking de rentabilidade <span class="hint">R$/exame</span></div>
      <div class="rank-list">${
        locRank.slice().sort((a,b)=>(b.v/b.q)-(a.v/a.q)).map((r,i)=>`
        <div class="rank-item">
          <div class="rank-pos ${i===0?"first":""}">${i+1}</div>
          <div class="rank-info">
            <div class="rank-name"><span class="dot" style="background:${SLOTS[r.loc.slot]}"></span><span>${esc(r.loc.name)}</span></div>
            <div class="rank-meta">${fmtN(r.q)} exames · total ${fmtBRL0(r.v)}${netFactor(r.loc.id)<1?` · líq. ${fmtBRL0(r.v*netFactor(r.loc.id))}`:""}</div>
          </div>
          <div class="rank-val"><b>${fmtBRL(r.v/r.q)}</b><small>por exame</small></div>
        </div>`).join("")
      }</div>
    </section>`;
  }

  // POR MODALIDADE + POR CONVÊNIO (barras horizontais, sequencial)
  const byMod = Array.from(sumBy(ent, e=>{ const m=(examById(e.examId)||{}).mod||"PROCED"; return MOD_LABELS[m]||m; }).entries()).sort((a,b)=>b[1].v-a[1].v);
  const byConv = Array.from(sumBy(ent, e=>e.conv).entries()).sort((a,b)=>b[1].v-a[1].v);
  html += `
  <section class="card">
    <div class="card-title">Por modalidade</div>
    ${hbars(byMod, total)}
  </section>
  <section class="card">
    <div class="card-title">Por convênio</div>
    ${hbars(byConv, total)}
  </section>`;

  // TOP EXAMES
  const byExam = Array.from(sumBy(ent, e=>e.examId).entries())
    .map(([id,d])=>({x:examById(id),...d})).filter(r=>r.x)
    .sort((a,b)=>b.v-a.v).slice(0,6);
  html += `
  <section class="card">
    <div class="card-title">Top exames por receita</div>
    <div class="rank-list">${byExam.map((r,i)=>`
      <div class="rank-item">
        <div class="rank-pos ${i===0?"first":""}">${i+1}</div>
        <div class="rank-info">
          <div class="rank-name"><span>${esc(dispName(r.x))}</span></div>
          <div class="rank-meta">${esc(r.x.mod)} · ${fmtN(r.q)} exames</div>
        </div>
        <div class="rank-val"><b>${fmtBRL0(r.v)}</b><small>${fmtBRL(r.v/r.q)}/exame</small></div>
      </div>`).join("")}
  </section>`;

  // INSIGHTS
  html += insightsCard(ent, total, nEx, locRank);

  $("#view").innerHTML = html;
  bindFilters();
  bindPayments(from, to);
  const wg=$("#wkGo"); if(wg) wg.onclick=()=>nav("agenda");
  drawTimeSeries(ent, from, to);
}

function heroMoney(v){
  const parts = fmtBRL(v).split(",");
  return esc(parts[0])+`<small>,${esc(parts[1]||"00")}</small>`;
}
function hbars(pairs, total){
  if(!pairs.length) return '<p class="note">Sem dados.</p>';
  const max = Math.max(...pairs.map(p=>p[1].v));
  return `<div class="hbar-list">`+pairs.map(([k,d])=>`
    <div class="hbar">
      <div class="hb-label"><span>${esc(k)}</span></div>
      <div class="hb-val">${fmtBRL0(d.v)}</div>
      <div class="hb-track"><div class="hb-fill" style="width:${(d.v/max*100).toFixed(1)}%;background:var(--seq)"></div></div>
      <div class="hb-sub">${fmtN(d.q)} exames · ${(d.v/total*100).toLocaleString("pt-BR",{maximumFractionDigits:0})}% da receita</div>
    </div>`).join("")+`</div>`;
}

function insightsCard(ent, total, nEx, locRank){
  const ins = [];
  const icon = p => `<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  // melhor dia da semana
  const byDow = new Map();
  ent.forEach(e=>{
    const dw = fromISO(e.date).getDay();
    const c = byDow.get(dw)||{v:0,days:new Set()};
    c.v+=entryValue(e); c.days.add(e.date); byDow.set(dw,c);
  });
  let best=null;
  byDow.forEach((c,dw)=>{ const avg=c.v/c.days.size; if(!best||avg>best.avg) best={dw,avg}; });
  if(best && byDow.size>1) ins.push([icon('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/>'),
    `Seu dia mais rentável é <b>${WEEKDAYS[best.dw]}</b>, com média de <b>${fmtBRL0(best.avg)}</b> por dia trabalhado.`]);
  // local mais rentável por exame
  if(locRank.length>1){
    const byTicket = locRank.slice().sort((a,b)=>(b.v/b.q)-(a.v/a.q));
    const t0=byTicket[0], tl=byTicket[byTicket.length-1];
    const ratio = (t0.v/t0.q)/(tl.v/tl.q);
    ins.push([icon('<path d="M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 1.8 2.6 5 3.3 5 1.6 5 3.7-2.2 3-5 3-5-1.1-5-3"/>'),
      `<b>${esc(t0.loc.name)}</b> paga <b>${fmtBRL(t0.v/t0.q)}</b> por exame — ${ratio>=1.15?`<b>${ratio.toLocaleString("pt-BR",{maximumFractionDigits:1})}×</b> o ticket de ${esc(tl.loc.name)}`:"o melhor ticket médio entre seus locais"}.`]);
  }
  // exame mais volumoso
  const byExam = Array.from(sumBy(ent,e=>e.examId).entries()).map(([id,d])=>({x:examById(id),...d})).filter(r=>r.x);
  if(byExam.length){
    const topQ = byExam.slice().sort((a,b)=>b.q-a.q)[0];
    ins.push([icon('<path d="M3 17l4-8 4 5 4-9 4 12"/>'),
      `O exame que você mais realiza é <b>${esc(dispName(topQ.x))}</b> (${fmtN(topQ.q)} no período), gerando <b>${fmtBRL0(topQ.v)}</b>.`]);
  }
  // concentração
  if(locRank.length>1){
    const sh = locRank[0].v/total*100;
    if(sh>=55) ins.push([icon('<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 4"/>'),
      `<b>${sh.toLocaleString("pt-BR",{maximumFractionDigits:0})}%</b> da sua receita vem de <b>${esc(locRank[0].loc.name)}</b> — atenção à concentração.`]);
  }
  // ticket médio geral
  if(nEx>0) ins.push([icon('<path d="M20 6 9 17l-5-5"/>'),
    `No período você laudou <b>${fmtN(nEx)}</b> exames com ticket médio de <b>${fmtBRL(total/nEx)}</b>.`]);
  if(!ins.length) return "";
  return `<section class="card"><div class="card-title">Insights</div>${
    ins.map(([ic,tx])=>`<div class="insight"><div class="ic">${ic}</div><div class="tx">${tx}</div></div>`).join("")
  }</section>`;
}

/* ================== MOTOR DE PROJEÇÃO ==================
   Aprende o padrão de agenda pelo comportamento:
   - média de faturamento por dia trabalhado em cada local (últimos 10 dias trabalhados)
   - média específica por dia da semana quando há amostras suficientes
   - frequência de trabalho por dia da semana nas últimas 8 semanas
   Projeção = realizado + compromissos agendados (valor esperado por plantão)
              + padrão comportamental nos dias/locais sem agenda           */
function buildStats(){
  const daily = new Map(); // locId -> Map(date -> receita do dia)
  S.entries.forEach(e=>{
    let m = daily.get(e.locId);
    if(!m){ m = new Map(); daily.set(e.locId, m); }
    m.set(e.date, (m.get(e.date)||0) + entryValue(e));
  });
  const stats = new Map();
  daily.forEach((m, loc)=>{
    const dates = Array.from(m.keys()).sort();
    const last10 = dates.slice(-10);
    const avg = last10.reduce((s,d)=>s+m.get(d),0)/last10.length;
    // média por dia da semana (últimos 40 dias trabalhados)
    const byDow = [[],[],[],[],[],[],[]];
    dates.slice(-40).forEach(d=> byDow[fromISO(d).getDay()].push(m.get(d)));
    const avgDow = byDow.map(a=> a.length>=2 ? a.reduce((x,y)=>x+y,0)/a.length : avg);
    // frequência por dia da semana (janela de 8 semanas, a partir do 1º lançamento)
    const t = todayISO(), first = dates[0];
    const cnt=[0,0,0,0,0,0,0], tot=[0,0,0,0,0,0,0];
    for(let i=55;i>=0;i--){
      const d = addDays(t,-i);
      if(d < first) continue;
      const dw = fromISO(d).getDay();
      tot[dw]++; if(m.has(d)) cnt[dw]++;
    }
    const freq = tot.map((n,i)=> n? cnt[i]/n : 0);
    stats.set(loc, {avg, avgDow, freq, workedDays:dates.length});
  });
  return stats;
}
function expectedForOcc(occ, stats, sameLocCount){
  const st = stats.get(occ.locId);
  if(!st) return {v:0, known:false};
  const dow = fromISO(occ.date).getDay();
  return {v: st.avgDow[dow]/(sameLocCount||1), known:true};
}
function monthProjection(){
  const d = new Date();
  const mFrom = toISO(new Date(d.getFullYear(), d.getMonth(), 1));
  const mEnd  = toISO(new Date(d.getFullYear(), d.getMonth()+1, 0));
  const t = todayISO();
  const stats = buildStats();
  const realized = S.entries.filter(e=>e.date>=mFrom && e.date<=mEnd)
    .reduce((s,e)=>s+entryValue(e),0);
  let sched=0, schedN=0, schedUnknown=0, patt=0;
  for(let day=addDays(t,1); day<=mEnd; day=addDays(day,1)){
    const occ = occurrences(day);
    const counts = {};
    occ.forEach(o=> counts[o.locId]=(counts[o.locId]||0)+1);
    const schedLocs = new Set(occ.map(o=>o.locId));
    occ.forEach(o=>{
      const ex = expectedForOcc(o, stats, counts[o.locId]);
      sched += ex.v; schedN++;
      if(!ex.known) schedUnknown++;
    });
    const dw = fromISO(day).getDay();
    stats.forEach((st, loc)=>{
      if(schedLocs.has(loc)) return;
      const p = st.freq[dw];
      if(p >= 0.25) patt += p*st.avgDow[dw]; // ≥2 de 8 semanas
    });
  }
  const daysLeft = Math.max(0, Math.round((fromISO(mEnd)-fromISO(t))/86400000));
  return {realized, sched, schedN, schedUnknown, patt, total:realized+sched+patt, mFrom, mEnd, stats, daysLeft};
}
function projectionCard(mp){
  if(!S.entries.length && !hasAgendaData()) return "";
  const d = new Date();
  const segs = [
    {v:mp.realized, c:"var(--accent)",  l:"Realizado até hoje"},
    {v:mp.sched,    c:"var(--s1)",      l:`Plantões agendados${mp.schedN?` (${mp.schedN})`:""}`},
    {v:mp.patt,     c:"var(--s7)",      l:"Padrão de agenda estimado"}
  ].filter(s=>s.v>0.5);
  const tot = mp.total||1;
  let note = "";
  if(!hasAgendaData()) note = "Cadastre seus plantões na aba Agenda para uma projeção mais precisa.";
  else if(mp.schedUnknown>0) note = "Alguns plantões agendados são em locais ainda sem histórico — o valor deles não entra na estimativa.";
  else note = "Estimativa aprendida com sua média por dia trabalhado em cada local nas últimas semanas.";
  return `
  <section class="card">
    <div class="card-title">Projeção de fechamento <span class="hint">${MONTHS_S[d.getMonth()]}/${d.getFullYear()} · faltam ${mp.daysLeft} dia${mp.daysLeft===1?"":"s"}</span></div>
    <div class="proj-total">${compact(mp.total)}</div>
    ${segs.length?`<div class="proj-bar">${segs.map(s=>`<i style="flex:${(s.v/tot).toFixed(4)};background:${s.c}"></i>`).join("")}</div>
    <div class="proj-leg">${segs.map(s=>`<div class="pl"><span class="dot" style="background:${s.c}"></span>${esc(s.l)}<b>${fmtBRL0(s.v)}</b></div>`).join("")}</div>`:""}
    <p class="note" style="margin-top:12px">${esc(note)}</p>
  </section>`;
}

/* ================== RECEBIMENTOS (pago × pendente) ================== */
function paymentsCard(ent, from, to){
  const received = ent.filter(e=>e.paid).reduce((s,e)=>s+entryValue(e),0);
  const pending  = ent.filter(e=>!e.paid).reduce((s,e)=>s+entryValue(e),0);
  const tot = received+pending;
  if(tot<=0) return "";
  const byLoc = new Map();
  ent.filter(e=>!e.paid).forEach(e=>{
    byLoc.set(e.locId,(byLoc.get(e.locId)||0)+entryValue(e));
  });
  const pendRows = Array.from(byLoc.entries())
    .map(([id,v])=>({loc:locById(id),v})).filter(r=>r.loc&&r.v>0.5)
    .sort((a,b)=>b.v-a.v);
  return `
  <section class="card">
    <div class="card-title">Recebimentos <span class="hint">período e filtros atuais</span></div>
    <div class="share-bar" style="margin-bottom:10px">
      ${received>0?`<div class="seg-fill" style="flex:${received};background:var(--accent)"></div>`:""}
      ${pending>0?`<div class="seg-fill" style="flex:${pending};background:var(--warn)"></div>`:""}
    </div>
    <div class="proj-leg" style="margin-bottom:${pendRows.length?"14px":"0"}">
      <div class="pl"><span class="dot" style="background:var(--accent)"></span>✓ Recebido<b>${fmtBRL0(received)}</b></div>
      <div class="pl"><span class="dot" style="background:var(--warn)"></span>⏳ Pendente<b>${fmtBRL0(pending)}</b></div>
    </div>
    ${pendRows.map((r,i)=>`
      <div class="lrow" style="padding:10px 0">
        <span class="dot" style="background:${SLOTS[r.loc.slot]}"></span>
        <div class="lr-main">
          <div class="lr-title" style="font-size:13px">${esc(r.loc.name)}</div>
          <div class="lr-sub">pendente: <b style="color:var(--warn)">${fmtBRL0(r.v)}</b>${netFactor(r.loc.id)<1?` · líq. ${fmtBRL0(r.v*netFactor(r.loc.id))}`:""}</div>
        </div>
        <button class="btn btn-sm" data-paymark="${r.loc.id}" style="flex:0 0 auto">✓ Recebi</button>
      </div>`).join("")}
  </section>`;
}
function bindPayments(from, to){
  $$("[data-paymark]").forEach(b=> b.onclick=()=>{
    const locId=b.dataset.paymark, l=locById(locId);
    const list = filteredEntries([from,to]).filter(e=>e.locId===locId && !e.paid);
    const v = list.reduce((s,e)=>s+entryValue(e),0);
    confirmSheet("Marcar como recebido?",
      `${list.length} lançamentos de ${l?l.name:""} no período filtrado (${fmtBRL0(v)}) serão marcados como pagos.`,
      "✓ Marcar como recebido",
      ()=>{ list.forEach(e=>e.paid=true); save(); toast("Recebimento registrado"); renderDash(); }, false);
  });
}

/* ================== COMPARATIVO MÊS A MÊS ================== */
function monthCompareCard(){
  const d = new Date();
  const rows = [];
  for(let i=5;i>=0;i--){
    const m = new Date(d.getFullYear(), d.getMonth()-i, 1);
    const from = toISO(m), to = toISO(new Date(m.getFullYear(), m.getMonth()+1, 0));
    const ent = filteredEntries([from,to]); // aplica filtros de local/convênio/modalidade/exame
    const v = ent.reduce((s,e)=>s+entryValue(e),0);
    const q = ent.reduce((s,e)=>s+e.qty,0);
    rows.push({label: MONTHS_S[m.getMonth()]+(m.getMonth()===0||i===5?"/"+String(m.getFullYear()).slice(2):""), mIdx:m.getMonth(), v, q, cur:i===0});
  }
  if(rows.every(r=>r.v===0)) return "";
  // gráfico de colunas (série única, sequencial; mês atual = parcial)
  const W=480, H=170, padL=8, padR=8, padT=26, padB=22;
  const maxV = niceCeil(Math.max(1,...rows.map(r=>r.v)));
  const iw=W-padL-padR, ih=H-padT-padB, n=rows.length;
  const step=iw/n, bw=Math.min(46, step-18);
  let bars="";
  rows.forEach((r,i)=>{
    const x=padL+step*i+(step-bw)/2;
    const h=Math.max(r.v>0?3:0,(r.v/maxV)*ih);
    const y=padT+ih-h;
    if(r.v>0){
      bars+=`<path d="${roundTopRect(x,y,bw,h,4)}" fill="var(--seq)" ${r.cur?'opacity="0.5"':""}/>`;
      bars+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text-2)" font-family="var(--font)">${axisLabel(r.v)}</text>`;
    }
    bars+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="${r.cur?"var(--text-2)":"var(--muted)"}" font-family="var(--font)">${esc(r.label)}</text>`;
  });
  // linhas de variação
  const deltas = rows.map((r,i)=>{
    if(i===0 || rows[i-1].v===0 || r.v===0) return "";
    const pc=(r.v-rows[i-1].v)/rows[i-1].v*100;
    const cls=pc>0.5?"up":(pc<-0.5?"down":"flat");
    const ar=pc>0.5?"↑":(pc<-0.5?"↓":"→");

      <div class="lr-sub">${fmtN(r.q)} exames</div></div>

    </div>`;
  }).join("");
  const anyDimFilter = F.loc!=="all"||F.conv!=="all"||F.mod!=="all"||F.exam!=="all";

      ${bars}
    </svg>
    ${deltas?`<div style="margin-top:6px">${deltas}</div>`:""}
  </section>`;
}

/* ================== TIME SERIES CHART (SVG colunas) ================== */
function drawTimeSeries(ent, from, to){
  const wrap = $("#tsChart"); if(!wrap) return;
  const span = Math.round((fromISO(to)-fromISO(from))/86400000)+1;
  // buckets: dia (≤35), semana (≤120), mês
  let buckets=[], mode="day";
  if(span<=35){
    for(let i=0;i<span;i++){ const iso=addDays(from,i); buckets.push({key:iso,label:fmtDateShort(iso),v:0,q:0}); }
  } else if(span<=180){
    mode="week";
    let cur=from;
    while(cur<=to){ const end=addDays(cur,6); buckets.push({key:cur,end,label:fmtDateShort(cur),v:0,q:0}); cur=addDays(cur,7); }
  } else {
    mode="month";
    let d=fromISO(from); d=new Date(d.getFullYear(),d.getMonth(),1);
    while(toISO(d)<=to){ buckets.push({key:toISO(d),label:MONTHS_S[d.getMonth()]+(d.getMonth()===0?" "+String(d.getFullYear()).slice(2):""),v:0,q:0}); d=new Date(d.getFullYear(),d.getMonth()+1,1); }
  }
  const idx = {};
  buckets.forEach((b,i)=>idx[b.key]=i);
  ent.forEach(e=>{
    let k;
    if(mode==="day") k=e.date;
    else if(mode==="week"){ const off=Math.floor((fromISO(e.date)-fromISO(from))/86400000/7); k=buckets[off]?buckets[off].key:null; }
    else { const d=fromISO(e.date); k=toISO(new Date(d.getFullYear(),d.getMonth(),1)); }
    const i = idx[k]; if(i==null) return;
    buckets[i].v += entryValue(e); buckets[i].q += e.qty;
  });

  const W=480, H=190, padL=44, padR=6, padT=12, padB=26;
  const maxV = Math.max(1,...buckets.map(b=>b.v));
  const niceMax = niceCeil(maxV);
  const iw=W-padL-padR, ih=H-padT-padB;
  const n=buckets.length;
  const bw=Math.min(24, Math.max(3, iw/n - 2));
  const step=iw/n;
  const y=v=> padT+ih-(v/niceMax*ih);
  // gridlines: 4 ticks limpos
  let g="";
  for(let i=0;i<=4;i++){
    const val=niceMax/4*i, yy=y(val);
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    g+=`<text x="${padL-7}" y="${yy+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--font)">${axisLabel(val)}</text>`;
  }
  // x labels: ~5
  const lblEvery=Math.max(1,Math.ceil(n/5));
  let bars="", xl="";
  buckets.forEach((b,i)=>{
    const x=padL+step*i+(step-bw)/2;
    const h=Math.max(b.v>0?2:0,(b.v/niceMax)*ih);
    const yy=padT+ih-h;
    if(b.v>0) bars+=`<path class="bar-col" data-i="${i}" d="${roundTopRect(x,yy,bw,h,Math.min(4,bw/2))}" fill="var(--seq)"/>`;
    bars+=`<rect data-i="${i}" x="${padL+step*i}" y="${padT}" width="${step}" height="${ih+padB}" fill="transparent"/>`;
    if(i%lblEvery===0) xl+=`<text x="${padL+step*i+step/2}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="var(--font)">${esc(b.label)}</text>`;
  });
  wrap.innerHTML=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" id="tsSvg">
    <line x1="${padL}" x2="${W-padR}" y1="${padT+ih}" y2="${padT+ih}" stroke="var(--axis)" stroke-width="1"/>
    ${g}${bars}${xl}</svg>`;

  const svg=$("#tsSvg"), tt=$("#tooltip");
  let hideT=null;
  const show=(i,cx,cy)=>{
    const b=buckets[i]; if(!b) return;
    $$(".bar-col",svg).forEach(p=>p.classList.toggle("dim", p.dataset.i!=String(i)));
    const title = mode==="day"? fmtDateLong(b.key) : (mode==="week"? "Semana de "+fmtDateShort(b.key) : b.label);
    tt.innerHTML=`<div class="tt-title">${esc(title)}</div><div class="tt-val">${fmtBRL(b.v)}</div><div class="tt-sub">${fmtN(b.q)} exame${b.q===1?"":"s"}</div>`;
    const r=wrap.getBoundingClientRect();
    tt.classList.add("show");
    const tw=tt.offsetWidth;
    let lx=cx-r.left-tw/2;
    lx=Math.max(4,Math.min(r.width-tw-4,lx));
    tt.style.left=(r.left+lx+window.scrollX)+"px";
    tt.style.top =(r.top+window.scrollY-tt.offsetHeight-8)+"px";
    clearTimeout(hideT); hideT=setTimeout(hide,2600);
  };
  const hide=()=>{ tt.classList.remove("show"); $$(".bar-col",svg).forEach(p=>p.classList.remove("dim")); };
  svg.addEventListener("pointerdown",ev=>{
    const t=ev.target.closest("[data-i]"); if(!t) return;
    show(+t.dataset.i, ev.clientX, ev.clientY);
  });
}
function niceCeil(v){
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]){ if(m*p>=v) return m*p; }
  return 10*p;
}
function axisLabel(v){
  if(v>=1e6) return (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";
  if(v>=1000) return (v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil";
  return String(Math.round(v));
}
function roundTopRect(x,y,w,h,r){
  r=Math.min(r,h);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function emptyState(icn,title,text,btnLabel,btnId){
  const icons={
    map:'<path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
    chart:'<path d="M3 17l4-8 4 5 4-9 4 12"/>',
    money:'<path d="M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 1.8 2.6 5 3.3 5 1.6 5 3.7-2.2 3-5 3-5-1.1-5-3"/>'
  };
  return `<div class="card"><div class="empty">
    <div class="em-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[icn]||icons.chart}</svg></div>
    <h3>${esc(title)}</h3><p>${esc(text)}</p>
    ${btnLabel?`<button class="btn btn-primary" id="${btnId}">${esc(btnLabel)}</button>`:""}
  </div></div>`;
}

<script>
"use strict";
/* ================== LANÇAR VOLUMETRIA ================== */
const draft = { date: todayISO(), locId:null, conv:null, qty:{}, search:"" };

function renderAdd(){
  if(!S.locations.length){
    $("#view").innerHTML = `<div class="page">`+emptyState("map","Cadastre um local primeiro",
      "Para lançar a volumetria você precisa de pelo menos um local de trabalho com preços definidos.",
      "Ir para Locais","goLocs2")+`</div>`;
    $("#goLocs2").onclick=()=>nav("locs");
    return;
  }
  if(!draft.locId || !locById(draft.locId)){
    // pré-seleciona o local do plantão de hoje (agenda) > último usado > primeiro
    const todOcc = draft.date===todayISO()? occurrences(todayISO()) : [];
    draft.locId = (todOcc[0] && todOcc[0].locId)
      || (S.last.locId && locById(S.last.locId)? S.last.locId : S.locations[0].id);
  }
  const loc = locById(draft.locId);
  const convs = loc.convenios.length? loc.convenios : ["Padrão"];
  if(!draft.conv || !convs.includes(draft.conv)) draft.conv = (S.last.conv && convs.includes(S.last.conv))? S.last.conv : convs[0];

  // exames ordenados: mais usados neste local primeiro, depois precificados, depois resto
  const usage = {};
  S.entries.forEach(e=>{ if(e.locId===draft.locId) usage[e.examId]=(usage[e.examId]||0)+1; });
  const priced = x => getPrice(draft.locId,x.id,draft.conv)!=null;
  const included = x => (loc.examIds||[]).includes(x.id);
  const locMods = (loc.mods&&loc.mods.length)? loc.mods : MODS;
  const q = draft.search.trim();
  let exams = S.exams.filter(x=> locMods.includes(x.mod) && matchExam(x,q));
  exams = exams.slice().sort((a,b)=>{
    const fa=a.fav?1:0, fb=b.fav?1:0;
    if(fa!==fb) return fb-fa;
    const ua=usage[a.id]||0, ub=usage[b.id]||0;
    if(ua!==ub) return ub-ua;
    const pa=(priced(a)?2:0)+(included(a)?1:0), pb=(priced(b)?2:0)+(included(b)?1:0);
    if(pa!==pb) return pb-pa;
    return dispName(a).localeCompare(dispName(b));
  });
  const favs = exams.filter(x=>x.fav);
  const rest = exams.filter(x=>!x.fav);
  const grouped = q? [["Resultados",exams]] :
    (favs.length? [["★ Favoritos",favs]]:[]).concat(
      MODS.filter(m=>locMods.includes(m)).map(m=>[MOD_LABELS[m]||m,rest.filter(x=>x.mod===m)]).filter(g=>g[1].length));

  const items = Object.entries(draft.qty).filter(([id,n])=>n>0);
  const totQ = items.reduce((s,[,n])=>s+n,0);
  const totV = items.reduce((s,[id,n])=>{ const p=getPrice(draft.locId,id,draft.conv)||0; return s+p*n; },0);

  $("#view").innerHTML = `<div class="page">
    <div class="sec-head" style="margin-top:0"><h2>Lançar exames</h2>
      <button id="adRepeat" style="display:flex;align-items:center;gap:5px;color:var(--accent);font-weight:700;font-size:13px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M3 12a9 9 0 1 0 2.6-6.3L3 8"/><path d="M3 3v5h5"/></svg>Repetir dia</button>
    </div>
    <div class="card" style="padding:15px">
      <div class="field"><label>Data</label><input type="date" class="input" id="adDate" value="${draft.date}" max="${todayISO()}"></div>
      <div class="field"><label>Local</label><div class="conv-chips">${
        S.locations.map(l=>`<button class="chip ${l.id===draft.locId?"on":""}" data-adloc="${l.id}"><span class="dot" style="background:${SLOTS[l.slot]}"></span>${esc(l.name)}</button>`).join("")
      }</div></div>
      <div class="field mb0"><label>Convênio</label><div class="conv-chips">${
        convs.map(c=>`<button class="chip ${c===draft.conv?"on":""}" data-adconv="${esc(c)}">${esc(c)}</button>`).join("")
      }</div></div>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:12px">
      <div class="search-box" style="flex:1;margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input class="input" id="adSearch" placeholder="Buscar (ex.: tvg, abd, mmii)…" value="${esc(draft.search)}" style="height:52px"></div>
      <button class="mic-btn" id="micBtn" aria-label="Lançar por voz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4M8 22h8"/></svg>
      </button>
      <button class="mic-btn" id="camBtn" aria-label="Lançar por imagem" style="background:var(--surface);border:1px solid var(--border);color:var(--accent);box-shadow:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
    </div>

    <div class="card" style="padding:6px 16px 10px">
      ${grouped.map(([m,list])=>`
        <div class="mod-head">${esc(m)}</div>
        ${list.map(x=>{
          const p = getPrice(draft.locId,x.id,draft.conv);
          const n = draft.qty[x.id]||0;
          return `<div class="lrow">
            <div class="lr-main">
              <div class="lr-title" style="white-space:normal;line-height:1.35;font-size:13.5px">${esc(dispName(x))}</div>
              <div class="lr-sub">${p!=null? fmtBRL(p)+" / exame" : '<button data-setprice="'+x.id+'" style="color:var(--warn);font-weight:700;font-size:11.5px">definir preço</button>'}</div>
            </div>
            <button class="fav-btn ${x.fav?"on":""}" data-fav="${x.id}" aria-label="favorito">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5L2.6 9.3l6.5-.9z"/></svg>
            </button>
            <div class="stepper">
              <button data-dec="${x.id}" aria-label="menos">−</button>
              <span class="qty ${n===0?"zero":""}">${n}</span>
              <button data-inc="${x.id}" aria-label="mais">+</button>
            </div>
          </div>`;
        }).join("")}`).join("") || '<p class="note" style="padding:16px 0">Nenhum exame encontrado. Adicione um exame novo em Locais → catálogo.</p>'}
    </div>

    ${totQ>0?`<button class="total-bar" id="adSave">
      <span class="tb-l">Salvar ${totQ} exame${totQ===1?"":"s"}<small>${esc(loc.name)} · ${esc(draft.conv)}${loc.gross&&loc.taxPct?` · bruto (−${loc.taxPct}%)`:""}</small></span>
      <span class="tb-r">${fmtBRL(totV)}</span>
    </button>`:""}
  </div>`;

  $("#adDate").onchange = e=>{ draft.date = e.target.value || todayISO(); };
  $$("[data-adloc]").forEach(b=> b.onclick=()=>{ draft.locId=b.dataset.adloc; draft.conv=null; renderAdd(); });
  $$("[data-adconv]").forEach(b=> b.onclick=()=>{ draft.conv=b.dataset.adconv; renderAdd(); });
  const sb=$("#adSearch");
  sb.oninput = ()=>{ draft.search=sb.value; renderAdd(); const s2=$("#adSearch"); s2.focus(); s2.setSelectionRange(s2.value.length,s2.value.length); };
  $$("[data-inc]").forEach(b=> b.onclick=()=>{ const id=b.dataset.inc; draft.qty[id]=(draft.qty[id]||0)+1; renderAdd(); });
  $$("[data-dec]").forEach(b=> b.onclick=()=>{ const id=b.dataset.dec; draft.qty[id]=Math.max(0,(draft.qty[id]||0)-1); renderAdd(); });
  $$("[data-setprice]").forEach(b=> b.onclick=()=> quickPriceSheet(b.dataset.setprice));
  $$("[data-fav]").forEach(b=> b.onclick=()=>{ const x=examById(b.dataset.fav); if(x){ x.fav=!x.fav; save(); renderAdd(); } });
  $("#adRepeat").onclick = repeatDaySheet;
  $("#micBtn").onclick = voiceSheet;
  $("#camBtn").onclick = imageSheet;
  const sv=$("#adSave"); if(sv) sv.onclick = saveDraft;
}

  onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,

const TURNO_WORDS = {matutino:"Matutino",manha:"Matutino",vespertino:"Vespertino",tarde:"Vespertino",noturno:"Noturno",noite:"Noturno"};
const VOICE_FILL = new Set(["de","do","da","dos","das","e","em","no","na","o","a","os","as","com","mais",
  "exame","exames","laudo","laudos","laudei","fiz","realizei","atendi","foram","turno","convenio",
  "local","atendimento","produtividade","plantao","x","vezes"]);

function parseVoiceText(text){
  const toks = normName(text).split(" ").filter(Boolean);
  const used = new Array(toks.length).fill(false);
  const res = { date:null, locId:null, conv:null, turno:null, items:[], leftovers:[] };
  const numAt = i => /^\d+$/.test(toks[i]) ? parseInt(toks[i],10) : (NUMWORDS[toks[i]] ?? null);

  // 1. DATA: hoje / ontem / anteontem / "dia N" / "N de <mês>"
  for(let i=0;i<toks.length;i++){
    if(toks[i]==="hoje"){ res.date=todayISO(); used[i]=true; break; }
    if(toks[i]==="ontem"){ res.date=addDays(todayISO(),-1); used[i]=true; break; }
    if(toks[i]==="anteontem"){ res.date=addDays(todayISO(),-2); used[i]=true; break; }
    if(toks[i]==="dia" && numAt(i+1)!=null){
      const dnum=numAt(i+1); used[i]=used[i+1]=true;
      let mIdx=new Date().getMonth(), yr=new Date().getFullYear();
      if(toks[i+2]==="de" && MONTH_WORDS[toks[i+3]]!=null){ mIdx=MONTH_WORDS[toks[i+3]]; used[i+2]=used[i+3]=true; }
      let d=toISO(new Date(yr,mIdx,Math.min(dnum,31)));
      if(d>todayISO()){ const dd=new Date(yr,mIdx-1,Math.min(dnum,31)); d=toISO(dd); }
      res.date=d; break;
    }
    if(numAt(i)!=null && toks[i+1]==="de" && MONTH_WORDS[toks[i+2]]!=null){
      const dnum=numAt(i); used[i]=used[i+1]=used[i+2]=true;
      let d=toISO(new Date(new Date().getFullYear(),MONTH_WORDS[toks[i+2]],Math.min(dnum,31)));
      if(d>todayISO()) d=toISO(new Date(new Date().getFullYear()-1,MONTH_WORDS[toks[i+2]],Math.min(dnum,31)));
      res.date=d; break;
    }
  }

  // 2. LOCAL: melhor cobertura de tokens significativos do nome
  let bestLoc=null, bestLocScore=0;
  S.locations.forEach(l=>{
    const lt = normName(l.name).split(" ").filter(t=>t.length>=3);
    if(!lt.length) return;
    const hits = lt.filter(t=> toks.some((tk,i)=>!used[i] && tk===t));
    const score = hits.length/lt.length;
    if(hits.length && score>bestLocScore){ bestLocScore=score; bestLoc={l,hits}; }
  });
  if(bestLoc && (bestLocScore>=0.5 || bestLoc.hits.some(t=>t.length>=5))){
    res.locId=bestLoc.l.id;
    bestLoc.hits.forEach(t=>{ const i=toks.findIndex((tk,j)=>!used[j]&&tk===t); if(i>=0) used[i]=true; });
  }
  // 3. CONVÊNIO do local
  const loc4 = locById(res.locId||draft.locId);
  if(loc4){
    (loc4.convenios||[]).forEach(c=>{
      const ct=normName(c).split(" ").filter(Boolean);
      const ok=ct.every(t=>toks.some((tk,i)=>!used[i]&&tk===t));
      if(ok && !res.conv){ res.conv=c; ct.forEach(t=>{ const i=toks.findIndex((tk,j)=>!used[j]&&tk===t); if(i>=0) used[i]=true; }); }
    });
  }
  // 4. TURNO (informativo)
  toks.forEach((t,i)=>{ if(!used[i] && TURNO_WORDS[t] && !res.turno){ res.turno=TURNO_WORDS[t]; used[i]=true; } });

  // 5. EXAMES: [quantidade] descrição …
  const locF = locById(res.locId||draft.locId);
  const locMods = (locF&&locF.mods&&locF.mods.length)? locF.mods : MODS;
  const pool = S.exams.filter(x=>locMods.includes(x.mod));
  const segs=[]; let cur=null;
  for(let i=0;i<toks.length;i++){
    if(used[i]) continue;
    const n=numAt(i);
    if(n!=null){ if(cur&&cur.words.length) segs.push(cur); cur={qty:n,words:[]}; continue; }
    if(VOICE_FILL.has(toks[i])) continue;
    if(!cur) cur={qty:1,words:[]};
    cur.words.push(toks[i]);
  }
  if(cur&&cur.words.length) segs.push(cur);
  segs.forEach(sg=>{
    const toks2 = sg.words.map(t=> ABBR[t]!==undefined? ABBR[t]:t).filter(Boolean);
    if(!toks2.length) return;
    let best=null,bestS=0;
    pool.forEach(x=>{
      const txt=examSearchText(x);
      let hit=0; toks2.forEach(t=>{ if(txt.includes(t)) hit++; });
      let sc=hit/toks2.length;
      if(sc>0){
        if(getPrice((locF||{}).id, x.id, res.conv||draft.conv)!=null) sc+=0.15;
        if(x.fav) sc+=0.08;
      }
      if(sc>bestS){ bestS=sc; best=x; }
    });
    if(best && bestS>=0.6) res.items.push({qty:sg.qty, text:sg.words.join(" "), exam:best});
    else res.leftovers.push((sg.qty>1? sg.qty+" ":"")+sg.words.join(" "));
  });
  return res;
}

        try{ recRef.start(); }catch(_){}
